                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="small text-muted fw-bold">Tìm kiếm</label>

                        <div class="col-md-1">

    <div class="modal fade" id="staffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Nhân Sự Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="staffForm">
                        <input type="hidden" id="staffId">
                        
                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="hoTen" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email (Không thể sửa)</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="soDienThoai" required>
                        </div>
                        <!-- <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="text" class="form-control" id="matKhau" placeholder="Mật khẩu">
                        </div> -->
                        <!-- Tạo mật khẩu random -->
                        <div class="mb-3">
                            <label class="form-label" id="lblMatKhau">Mật khẩu</label>
                            <div class="input-group">
                                <input type="text" class="form-control fw-bold text-primary" id="matKhau" required placeholder="Bấm nút bên cạnh để tạo...">
                                
                                <button class="btn btn-outline-secondary" type="button" onclick="generateRandomPass()" title="Tạo mật khẩu ngẫu nhiên">
                                    <i class="fa-solid fa-arrows-rotate"></i> Random
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Chức vụ</label>
                            <select class="form-select" id="vaiTro" required>
                                <option value="NhanVienBanVe">Nhân viên bán vé</option>
                                <option value="TaiXe">Tài xế</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') window.location.href = '/login.html';
        document.getElementById('station-admin-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;
        const token = localStorage.getItem('token');

        let allStaff = [];

        // 1. Load Danh sách Nhân viên
        async function loadStaff() {
            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allStaff = await res.json();
                renderTable(allStaff);
            } catch (error) { console.error(error); }
        }

        // 2. Render Table

        //                 <td class="fw-bold">${u.hoTen}</td>
        //                 <td>
        //                     <div>${u.email}</div>
        //                     <small class="text-muted">${u.soDienThoai}</small>
        //                 </td>
        //                 <td>${roleBadge}</td>
        //                 <td>
        //                     <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${u._id}')"><i class="fa-solid fa-pen"></i></button>
        //                     <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteStaff('${u._id}')"><i class="fa-solid fa-trash"></i></button>
        //                 </td>
        //             </tr>
        //         `;

        // 2. Render Table (Đã cập nhật CSS đẹp)
        function renderTable(data) {
            const tbody = document.getElementById('table-staff');
            tbody.innerHTML = '';

            // Lọc bỏ chính mình (Admin đang đăng nhập) khỏi danh sách
            const filteredData = data.filter(u => u._id !== user.id);

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Không tìm thấy nhân viên</td></tr>';
                return;
            }

            filteredData.forEach(u => {
                // --- LOGIC CHỌN MÀU VÀ TÊN HIỂN THỊ ---
                let badgeConfig = { text: 'Khác', css: 'badge-gradient-blue' };

                if (u.vaiTro === 'NhanVienBanVe') {
                    badgeConfig = { text: 'Bán vé', css: 'badge-gradient-green' };
                } else if (u.vaiTro === 'TaiXe') {
                    badgeConfig = { text: 'Tài xế', css: 'badge-gradient-yellow' };
                }
                // ---------------------------------------

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${u.hoTen}</td>
                        <td>
                            <div>${u.email}</div>
                            <small class="text-muted">${u.soDienThoai}</small>
                        </td>
                        <td>
                            <span class="badge-gradient-base ${badgeConfig.css}">
                                ${badgeConfig.text}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${u._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteStaff('${u._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Logic Tìm kiếm & Lọc
        function filterStaff() {
            const role = document.getElementById('filterRole').value;
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();

            const filtered = allStaff.filter(u => {
                const matchRole = role === "" || u.vaiTro === role;
                const textData = (u.hoTen + u.soDienThoai).toLowerCase();
                const matchKeyword = textData.includes(keyword);
                return matchRole && matchKeyword;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('filterRole').value = '';
            document.getElementById('searchKeyword').value = '';
            renderTable(allStaff);
        }

        function generateRandomPass() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('matKhau').value = result;
        }

        // 4. Modal Add
        function openAddModal() {
            document.getElementById('staffForm').reset();
            document.getElementById('staffId').value = '';
            document.getElementById('email').disabled = false; // Cho nhập email
            document.getElementById('matKhau').placeholder = "Nhập mật khẩu (Bắt buộc)";
            document.getElementById('matKhau').required = true;
            
            document.getElementById('modalTitle').innerText = 'Thêm Nhân Sự Mới';
            document.getElementById('btnSave').innerText = 'Tạo tài khoản';
            
            generateRandomPass();

            new bootstrap.Modal(document.getElementById('staffModal')).show();
        }

        // 5. Modal Edit
        function openEditModal(id) {
            const u = allStaff.find(s => s._id === id);
            if(!u) return;

            document.getElementById('staffId').value = u._id;
            document.getElementById('hoTen').value = u.hoTen;
            document.getElementById('email').value = u.email;
            document.getElementById('email').disabled = true; // Không cho sửa email (ID đăng nhập)
            document.getElementById('soDienThoai').value = u.soDienThoai;
            document.getElementById('vaiTro').value = u.vaiTro;
            
            // Mật khẩu không bắt buộc khi sửa
            document.getElementById('matKhau').value = '';
            document.getElementById('matKhau').placeholder = "Nhập nếu muốn đổi pass (để trống giữ nguyên)";
            document.getElementById('matKhau').required = false;

            document.getElementById('modalTitle').innerText = 'Cập Nhật Thông Tin';
            document.getElementById('btnSave').innerText = 'Lưu thay đổi';
            new bootstrap.Modal(document.getElementById('staffModal')).show();
        }

        // 6. Submit
        document.getElementById('staffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('staffId').value;
            
            const data = {
                hoTen: document.getElementById('hoTen').value,
                email: document.getElementById('email').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                vaiTro: document.getElementById('vaiTro').value
            };

            const matKhau = document.getElementById('matKhau').value;
            if (matKhau) data.matKhau = matKhau; // Chỉ gửi nếu có nhập

            let url = `${API_URL}/users`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(id ? 'Cập nhật thành công' : 'Tạo mới thành công');
                    bootstrap.Modal.getInstance(document.getElementById('staffModal')).hide();
                    loadStaff();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        // 7. Delete
        async function deleteStaff(id) {
            if(!confirm('Chắc chắn xóa nhân viên này?')) return;
            const res = await fetch(`${API_URL}/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) loadStaff();
            else alert('Lỗi khi xóa');
        }

        loadStaff();
    </script>
