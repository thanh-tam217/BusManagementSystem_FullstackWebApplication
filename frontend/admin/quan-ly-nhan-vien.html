<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Nhân Viên - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus me-2"></i> STATION
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-station.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span class="menu-title">Tổng quan bến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-xe.html">
                    <i class="fa-solid fa-bus-simple"></i>
                    <span class="menu-title">Quản lý xe</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-chuyen.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span class="menu-title">Lịch trình chuyến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-nhan-vien.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span class="menu-title">Nhân viên</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Trưởng bến</p>
                    <small class="text-muted">Trưởng bến</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=Station+Admin&background=047edf&color=fff" class="rounded-circle" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-warning text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-users-gear"></i>
                    </span> Nhân Sự Bến Xe
                </h3>
                <button class="btn btn-gradient-primary" data-bs-toggle="modal" data-bs-target="#addStaffModal">
                    <i class="fa-solid fa-user-plus me-1"></i> Thêm Nhân Viên
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Họ Tên</th>
                                    <th>Email / SĐT</th>
                                    <th>Chức vụ</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-staff">
                                <tr><td colspan="4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addStaffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm Nhân Sự Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStaffForm">
                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="hoTen" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email (Tên đăng nhập)</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="soDienThoai" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mặc định</label>
                            <input type="text" class="form-control" id="matKhau" value="123456" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chức vụ</label>
                            <select class="form-select" id="vaiTro" required>
                                <option value="NhanVienBanVe">Nhân viên bán vé</option>
                                <option value="TaiXe">Tài xế</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary">Tạo tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;

        const token = localStorage.getItem('token');

        // 1. Load danh sách nhân viên (Backend tự lọc nhân viên của bến này)
        async function loadStaff() {
            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const tbody = document.getElementById('table-staff');
                tbody.innerHTML = '';

                data.forEach(u => {
                    // Bỏ qua chính bản thân Admin (nếu API trả về)
                    if (u._id === user.id) return;

                    let roleBadge = u.vaiTro === 'NhanVienBanVe' 
                        ? '<span class="badge badge-gradient-success">Bán vé</span>' 
                        : '<span class="badge badge-gradient-warning text-dark">Tài xế</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${u.hoTen}</td>
                            <td>
                                <div>${u.email}</div>
                                <small class="text-muted">${u.soDienThoai}</small>
                            </td>
                            <td>${roleBadge}</td>
                            <td>
                                <button class="btn btn-sm btn-inverse-danger" onclick="deleteStaff('${u._id}')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        // 2. Thêm Nhân viên
        document.getElementById('addStaffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                hoTen: document.getElementById('hoTen').value,
                email: document.getElementById('email').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                matKhau: document.getElementById('matKhau').value,
                vaiTro: document.getElementById('vaiTro').value
                // Không cần gửi maBenQuanLy, backend tự lấy
            };

            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Tạo nhân viên thành công!');
                    document.getElementById('addStaffForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addStaffModal')).hide();
                    loadStaff();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        // 3. Xóa Nhân viên
        async function deleteStaff(id) {
            if(!confirm('Chắc chắn xóa nhân viên này?')) return;
            await fetch(`${API_URL}/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadStaff();
        }

        loadStaff();
    </script>
</body>
</html>
