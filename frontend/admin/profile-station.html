<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân - System Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus me-2"></i> STATION
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard-station.html"><i class="fa-solid fa-chart-line"></i><span class="menu-title">Tổng quan bến</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-xe.html"><i class="fa-solid fa-bus-simple"></i><span class="menu-title">Quản lý xe</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-chuyen.html"><i class="fa-regular fa-calendar-check"></i><span class="menu-title">Lịch trình chuyến</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-nhan-vien.html"><i class="fa-solid fa-user-tie"></i><span class="menu-title">Nhân viên</span></a></li>
            
            <li class="nav-item">
                <a class="nav-link active" href="profile-station.html">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="menu-title">Thông tin cá nhân</span>
                </a>
            </li>

            <li class="nav-item mt-5"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span class="menu-title">Đăng xuất</span></a></li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="header-name">Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=9a55ff&color=fff" class="rounded-circle" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-primary text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-user-shield"></i>
                    </span> Hồ Sơ Quản Trị Viên
                </h3>
            </div>

            <div class="row">
                <div class="col-md-4 grid-margin stretch-card">
                    <div class="card shadow-sm border-0 text-center">
                        <div class="card-body">
                            <div class="mb-4 position-relative d-inline-block">
                                <img src="" class="rounded-circle img-fluid border border-3 border-light shadow" id="profile-avatar" style="width: 120px;">
                            </div>
                            <h4 class="fw-bold mb-1" id="display-name">...</h4>
                            <p class="text-muted mb-3" id="display-role">Admin Hệ Thống</p>
                            <p class="small text-muted mb-4"><i class="fa-solid fa-location-dot me-1"></i> <span id="display-address">...</span></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-8 grid-margin stretch-card">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="card-title mb-0">Thông tin chi tiết</h4>
                                <button class="btn btn-outline-primary btn-sm fw-bold" id="btn-edit" onclick="enableEditMode()">
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Chỉnh sửa
                                </button>
                            </div>

                            <form id="profileForm">
                                <div class="form-group mb-3">
                                    <label class="form-label fw-bold text-muted small">HỌ VÀ TÊN</label>
                                    <input type="text" class="form-control fw-bold text-dark" id="hoTen" disabled>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">EMAIL</label>
                                        <input type="email" class="form-control bg-light" id="email" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">SỐ ĐIỆN THOẠI</label>
                                        <input type="text" class="form-control fw-bold text-dark" id="soDienThoai" disabled>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">NGÀY SINH</label>
                                        <input type="date" class="form-control" id="ngaySinh" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">GIỚI TÍNH</label>
                                        <select class="form-select" id="gioiTinh" disabled>
                                            <option value="Nam">Nam</option>
                                            <option value="Nu">Nữ</option>
                                            <option value="Khac">Khác</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group mb-4">
                                    <label class="form-label fw-bold text-muted small">ĐỊA CHỈ</label>
                                    <input type="text" class="form-control" id="diaChi" placeholder="Chưa cập nhật" disabled>
                                </div>

                                <div id="password-section" class="d-none p-3 bg-light rounded mb-3">
                                    <h6 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-lock me-2"></i>Đổi mật khẩu</h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-2"><input type="password" class="form-control form-control-sm" id="matKhauMoi" placeholder="Mật khẩu mới"></div>
                                        <div class="col-md-6 mb-2"><input type="password" class="form-control form-control-sm" id="xacNhanMatKhau" placeholder="Xác nhận mật khẩu"></div>
                                    </div>
                                </div>

                                <div id="action-buttons" class="d-none text-end">
                                    <button type="button" class="btn btn-light me-2" onclick="cancelEditMode()">Hủy bỏ</button>
                                    <button type="submit" class="btn btn-gradient-success fw-bold px-4"><i class="fa-solid fa-check me-1"></i> Lưu Thay Đổi</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        // Copy y nguyên phần Script từ file profile.html của nhân viên sang đây
        // Chỉ cần thay đổi logic check quyền ở dòng đầu tiên
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') window.location.href = '/login.html';
        
        // ... (Dán toàn bộ phần JS còn lại vào đây) ...
        
        // --- COPY ĐOẠN JS TỪ FILE profile.html VÀO ĐÂY (Từ dòng document.getElementById('header-name')... trở xuống) ---
        document.getElementById('header-name').innerText = user.hoTen;
        let originalData = {}; 

        async function loadProfile() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const myProfile = await res.json();
                    originalData = myProfile;
                    renderDataToForm(myProfile);
                } else { if(res.status === 401) window.location.href = '/login.html'; }
            } catch (error) { console.error(error); }
        }

        function renderDataToForm(data) {
            document.getElementById('hoTen').value = data.hoTen;
            document.getElementById('email').value = data.email;
            document.getElementById('soDienThoai').value = data.soDienThoai;
            document.getElementById('diaChi').value = data.diaChi || '';
            document.getElementById('gioiTinh').value = data.gioiTinh || 'Nam';
            if(data.ngaySinh) document.getElementById('ngaySinh').value = new Date(data.ngaySinh).toISOString().split('T')[0];

            document.getElementById('display-name').innerText = data.hoTen;
            document.getElementById('display-role').innerText = 'Admin Bến Xe'; // Text cứng cho đẹp
            document.getElementById('display-address').innerText = data.diaChi || 'Việt Nam';
            document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${data.hoTen}&background=random&size=128`;
        }

        window.enableEditMode = function() {
            document.getElementById('btn-edit').classList.add('d-none');
            document.getElementById('action-buttons').classList.remove('d-none');
            document.getElementById('password-section').classList.remove('d-none');
            document.querySelectorAll('#profileForm input:not(#email), #profileForm select').forEach(input => {
                input.disabled = false; input.classList.remove('text-dark', 'fw-bold'); input.classList.add('bg-white');
            });
        }

        window.cancelEditMode = function() {
            document.getElementById('btn-edit').classList.remove('d-none');
            document.getElementById('action-buttons').classList.add('d-none');
            document.getElementById('password-section').classList.add('d-none');
            document.querySelectorAll('#profileForm input, #profileForm select').forEach(input => {
                input.disabled = true; input.classList.add('text-dark', 'fw-bold'); input.classList.remove('bg-white');
            });
            renderDataToForm(originalData);
            document.getElementById('matKhauMoi').value = ''; document.getElementById('xacNhanMatKhau').value = '';
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matKhauMoi = document.getElementById('matKhauMoi').value;
            const xacNhan = document.getElementById('xacNhanMatKhau').value;
            if (matKhauMoi && matKhauMoi !== xacNhan) { alert("Mật khẩu không khớp!"); return; }

            const data = {
                hoTen: document.getElementById('hoTen').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                diaChi: document.getElementById('diaChi').value,
                gioiTinh: document.getElementById('gioiTinh').value,
                ngaySinh: document.getElementById('ngaySinh').value
            };
            if (matKhauMoi) data.matKhauMoi = matKhauMoi;

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    const updatedUser = await res.json();
                    const localUser = JSON.parse(localStorage.getItem('user'));
                    localUser.hoTen = updatedUser.hoTen;
                    localStorage.setItem('user', JSON.stringify(localUser));
                    alert('Cập nhật thành công!');
                    window.location.reload(); 
                } else { alert((await res.json()).message); }
            } catch (error) { console.error(error); }
        });

        loadProfile();
    </script>
</body>
</html>
