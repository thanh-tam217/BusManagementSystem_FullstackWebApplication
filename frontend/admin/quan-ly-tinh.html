    <div class="main-panel">
        
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">

                <i class="fa-solid fa-bars text-secondary fs-4 me-3 d-lg-none"></i>
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" class="form-control" placeholder="Tìm kiếm...">
                </div>
            </div>
            <div class="d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Admin</p>
                    <small class="text-muted">Quản trị viên</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=User&background=random&size=128" class="rounded-circle img-fluid border border-3 border-light shadow" id="profile-avatar-header" style="width: 40px;">
                <!-- <img src="https://ui-avatars.com/api/?name=System+Admin&background=9a55ff&color=fff" class="rounded-circle" width="40"> -->
            </div>

        <div class="content-wrapper p-4">
            
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold" style="color: #0081a7;">
                    <i class="fa-solid fa-city"></i> Quản lý tỉnh thành
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Tỉnh Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="input-group mb-3" style="max-width: 400px;">
                        <span class="input-group-text bg-light border-0"><i class="fa-solid fa-search"></i></span>
                        <input type="text" class="form-control border-0 bg-light" id="searchTinh" placeholder="Tìm kiếm tên tỉnh..." onkeyup="filterTinh()">
                        <!-- Button reset -->
                        <button class="btn btn-secondary fw-bold" onclick="resetFilter()">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>   
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên Tỉnh / Thành Phố</th>
                                    <th>Ngày tạo</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="4" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tinhModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Tỉnh Thành Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tinhForm">
                        <input type="hidden" id="tinhId">
                        <div class="mb-3">
                            <label class="form-label">Tên Tỉnh / Thành phố</label>
                            <input type="text" class="form-control" id="tenTinh" required placeholder="Ví dụ: Hà Nội">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;

        let allTinh = [];

        // 1. Load danh sách Tỉnh
        async function loadTinh() {
            try {
                const res = await fetch(`${API_URL}/tinh-thanh`);
                allTinh = await res.json();
                renderTable(allTinh);
            } catch (error) { console.error(error); }
        }

        // 2. Render Bảng
        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Không tìm thấy dữ liệu</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-bold text-primary">${item.tenTinh}</td>
                        <td>${new Date(item.createdAt).toLocaleDateString('vi-VN')}</td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${item._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteTinh('${item._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Tìm kiếm
        function filterTinh() {
            const keyword = document.getElementById('searchTinh').value.toLowerCase();
            const filtered = allTinh.filter(t => t.tenTinh.toLowerCase().includes(keyword));
            renderTable(filtered);
        }

        function resetFilter() {
            // Xóa giá trị chọn
            document.getElementById('searchTinh').value = "";
            // Render lại toàn bộ danh sách gốc
            renderTable(allTinh);
        }

        // 4. Modal Thêm
        window.openAddModal = function() {
            document.getElementById('tinhForm').reset();
            document.getElementById('tinhId').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm Tỉnh Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('tinhModal')).show();
        }

        // 5. Modal Sửa
        window.openEditModal = function(id) {
            const item = allTinh.find(t => t._id === id);
            if (!item) return;
            
            document.getElementById('tinhId').value = item._id;
            document.getElementById('tenTinh').value = item.tenTinh;
            document.getElementById('modalTitle').innerText = 'Cập Nhật Tỉnh';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('tinhModal')).show();
        }

        // 6. Submit (Add/Update)
        document.getElementById('tinhForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tinhId').value;
            const tenTinh = document.getElementById('tenTinh').value;
            const token = localStorage.getItem('token');

            let url = `${API_URL}/tinh-thanh`;
            let method = 'POST';
            
            if (id) {
                url = `${API_URL}/tinh-thanh/${id}`;
                method = 'PUT';
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ tenTinh })
                });

                if (res.ok) {
                    alert(id ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('tinhModal')).hide();
                    loadTinh();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { alert('Lỗi kết nối!'); }
        });

        // 7. Hàm Xóa Tỉnh (Đã hoàn thiện)
        window.deleteTinh = async function(id) {
            // Hỏi xác nhận
            if(!confirm("Bạn có chắc chắn muốn xóa tỉnh này không?")) return;
            
            const token = localStorage.getItem('token');
            
            try {
                const res = await fetch(`${API_URL}/tinh-thanh/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.ok) {
                    alert("Đã xóa thành công!");
                    loadTinh(); // Tải lại danh sách
                } else {
                    // Nếu backend trả về lỗi (ví dụ: đang có bến xe), hiển thị thông báo
                    const err = await res.json();
                    alert("Lỗi: " + err.message);
                }
            } catch (error) {
                console.error(error);
                alert("Lỗi kết nối server!");
            }
        }

        loadTinh();
    </script>
</body>
</html>
