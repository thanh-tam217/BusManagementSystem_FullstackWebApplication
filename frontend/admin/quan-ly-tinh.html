<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tỉnh - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus-simple me-2"></i> VEXE APP
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-system.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="menu-title">Tổng quan</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-tinh.html">
                    <i class="fa-solid fa-city"></i>
                    <span class="menu-title">Quản lý Tỉnh</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-ben.html">
                    <i class="fa-solid fa-landmark"></i>
                    <span class="menu-title">Quản lý Bến xe</span>
                </a>
            </li>
             <li class="nav-item">
                <a class="nav-link" href="quan-ly-user.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-title">Người dùng</span>
                </a>
            </li>
             <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="user-name">Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=9a55ff&color=fff" class="rounded-circle" width="35">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-primary text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-city"></i>
                    </span> Quản lý Tỉnh Thành
                </h3>
                <button class="btn btn-gradient-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Tỉnh Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên Tỉnh / Thành Phố</th>
                                    <th>Ngày tạo</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="4" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm Tỉnh Thành Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Tên Tỉnh / Thành phố</label>
                            <input type="text" class="form-control" id="tenTinh" required placeholder="Ví dụ: Hà Nội">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        // 1. Check Login
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;

        // 2. Hàm Load danh sách Tỉnh
        async function loadTinh() {
            try {
                const res = await fetch(`${API_URL}/tinh-thanh`);
                const data = await res.json();
                
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                data.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="fw-bold text-primary">${item.tenTinh}</td>
                            <td>${new Date(item.createdAt).toLocaleDateString('vi-VN')}</td>
                            <td>
                                <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="alert('Chức năng xóa đang phát triển')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // 3. Hàm Thêm Tỉnh Mới
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tenTinh = document.getElementById('tenTinh').value;
            const token = localStorage.getItem('token');

            try {
                const res = await fetch(`${API_URL}/tinh-thanh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // Quan trọng: Gửi Token Admin
                    },
                    body: JSON.stringify({ tenTinh })
                });

                if (res.ok) {
                    alert('Thêm thành công!');
                    document.getElementById('tenTinh').value = ''; // Xóa trắng ô nhập
                    
                    // Đóng Modal (Dùng Bootstrap API)
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
                    modal.hide();

                    loadTinh(); // Tải lại bảng
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) {
                alert('Lỗi kết nối!');
            }
        });

        // Chạy ngay khi vào trang
        loadTinh();
    </script>
</body>
</html>
