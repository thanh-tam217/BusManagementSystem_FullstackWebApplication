<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Trình Chuyến - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo"><i class="fa-solid fa-bus me-2"></i> STATION</div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard-station.html"><i class="fa-solid fa-chart-line"></i><span class="menu-title">Tổng quan bến</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-xe.html"><i class="fa-solid fa-bus-simple"></i><span class="menu-title">Đội xe</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-tuyen.html"><i class="fa-solid fa-map-location-dot"></i><span class="menu-title">Tuyến đường</span></a></li>
            <li class="nav-item"><a class="nav-link active" href="quan-ly-chuyen.html"><i class="fa-regular fa-calendar-check"></i><span class="menu-title">Lịch trình chuyến</span></a></li>
            <li class="nav-item"><a class="nav-link" href="quan-ly-nhan-vien.html"><i class="fa-solid fa-user-tie"></i><span class="menu-title">Nhân viên</span></a></li>
            <li class="nav-item mt-5"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fa-solid fa-power-off"></i><span class="menu-title">Đăng xuất</span></a></li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="user-name">Trưởng bến</span>
                <img src="https://ui-avatars.com/api/?name=Station+Admin&background=047edf&color=fff" class="rounded-circle" width="35">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-success text-white me-2 p-2 rounded"><i class="fa-regular fa-calendar-check"></i></span> Lịch Trình Chuyến Xe
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Lên Lịch Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="input-group mb-3" style="max-width: 400px;">
                        <span class="input-group-text bg-light border-0"><i class="fa-solid fa-search"></i></span>
                        <input type="text" class="form-control border-0 bg-light" id="searchChuyen" placeholder="Tìm theo tuyến hoặc biển số..." onkeyup="filterChuyen()">
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tuyến đường</th>
                                    <th>Xe chạy</th>
                                    <th>Giờ đi</th>
                                    <th>Giá vé</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-chuyen"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="chuyenModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Lên Lịch Chuyến Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="chuyenForm">
                        <input type="hidden" id="chuyenId"> <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Chọn Tuyến</label>
                                <select class="form-select" id="maTuyen" required><option value="">-- Chọn tuyến --</option></select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Chọn Xe</label>
                                <select class="form-select" id="maXe" required><option value="">-- Chọn xe --</option></select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-danger">Bến Đến</label>
                            <select class="form-select" id="benDen" required><option value="">-- Chọn bến đích --</option></select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thời gian khởi hành</label>
                                <input type="datetime-local" class="form-control" id="thoiGianKhoiHanh" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Giá vé (VND)</label>
                                <input type="number" class="form-control" id="giaVe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" id="trangThai">
                                <option value="DangCho">Đang chờ (Sắp chạy)</option>
                                <option value="DangDi">Đang đi</option>
                                <option value="DaKetThuc">Đã kết thúc</option>
                                <option value="Huy">Đã hủy</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;
        const token = localStorage.getItem('token');

        let allChuyen = [];

        // 1. Helper: Format Date cho input datetime-local (YYYY-MM-DDTHH:mm)
        function formatDateTimeForInput(isoString) {
            const date = new Date(isoString);
            date.setMinutes(date.getMinutes() - date.getTimezoneOffset()); // Chỉnh múi giờ
            return date.toISOString().slice(0, 16);
        }

        // 2. Load Dropdowns
        async function loadDropdowns() {
            try {
                // Tuyến
                const resTuyen = await fetch(`${API_URL}/tuyen-xe`, { headers: { 'Authorization': `Bearer ${token}` }});
                const dataTuyen = await resTuyen.json();
                dataTuyen.forEach(t => document.getElementById('maTuyen').innerHTML += `<option value="${t._id}">${t.diemDi.tenTinh} -> ${t.diemDen.tenTinh}</option>`);

                // Xe
                const resXe = await fetch(`${API_URL}/xe`, { headers: { 'Authorization': `Bearer ${token}` }});
                const dataXe = await resXe.json();
                dataXe.forEach(x => document.getElementById('maXe').innerHTML += `<option value="${x._id}">${x.bienSo} (${x.loaiXe})</option>`);

                // Bến
                const resBen = await fetch(`${API_URL}/ben-xe`);
                const dataBen = await resBen.json();
                dataBen.forEach(b => document.getElementById('benDen').innerHTML += `<option value="${b._id}">${b.tenBen}</option>`);
            } catch (e) { console.error(e); }
        }

        // 3. Load Danh Sách Chuyến
        async function loadChuyen() {
            const res = await fetch(`${API_URL}/chuyen-xe`, { headers: { 'Authorization': `Bearer ${token}` }});
            allChuyen = await res.json();
            renderTable(allChuyen);
        }

        // 4. Render Table
        function renderTable(data) {
            const tbody = document.getElementById('table-chuyen');
            tbody.innerHTML = '';
            
            data.forEach(c => {
                const time = new Date(c.thoiGianKhoiHanh).toLocaleString('vi-VN');
                const gia = new Intl.NumberFormat('vi-VN').format(c.giaVe);
                // Fix lỗi hiển thị tên bến
                const tenBenDi = c.benKhoiHanh ? c.benKhoiHanh.tenBen : '?';
                const tenBenDen = c.benDen ? c.benDen.tenBen : '?';
                // const tenTuyen = c.maTuyen ? (c.maTuyen.diemDi.tenTinh + ' - ' + c.maTuyen.diemDen.tenTinh) : 'Tuyến bị xóa';

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="fw-bold text-primary">${tenBenDi} <i class="fa-solid fa-arrow-right small text-dark"></i> ${tenBenDen}</div>
                            
                        </td>
                        <td>${c.maXe ? c.maXe.bienSo : 'Xe đã xóa'}</td>
                        <td>${time}</td>
                        <td class="text-success fw-bold">${gia} đ</td>
                        <td><span class="badge badge-gradient-info">${c.trangThai}</span></td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${c._id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteChuyen('${c._id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // 5. Filter
        function filterChuyen() {
            const key = document.getElementById('searchChuyen').value.toLowerCase();
            const filtered = allChuyen.filter(c => {
                const tuyen = c.maTuyen ? (c.maTuyen.diemDi.tenTinh + c.maTuyen.diemDen.tenTinh) : '';
                const xe = c.maXe ? c.maXe.bienSo : '';
                return tuyen.toLowerCase().includes(key) || xe.toLowerCase().includes(key);
            });
            renderTable(filtered);
        }

        // 6. Modal Logic
        function openAddModal() {
            document.getElementById('chuyenForm').reset();
            document.getElementById('chuyenId').value = '';
            document.getElementById('modalTitle').innerText = 'Lên Lịch Chuyến Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('chuyenModal')).show();
        }

        function openEditModal(id) {
            const c = allChuyen.find(x => x._id === id);
            if(!c) return;

            document.getElementById('chuyenId').value = c._id;
            document.getElementById('maTuyen').value = c.maTuyen ? c.maTuyen._id : '';
            document.getElementById('maXe').value = c.maXe ? c.maXe._id : '';
            document.getElementById('benDen').value = c.benDen ? c.benDen._id : '';
            document.getElementById('giaVe').value = c.giaVe;
            document.getElementById('trangThai').value = c.trangThai;
            
            // Xử lý ngày giờ khó chịu
            document.getElementById('thoiGianKhoiHanh').value = formatDateTimeForInput(c.thoiGianKhoiHanh);

            document.getElementById('modalTitle').innerText = 'Cập Nhật Chuyến';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('chuyenModal')).show();
        }

        // 7. Submit (Add/Update)
        document.getElementById('chuyenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('chuyenId').value;
            const data = {
                maTuyen: document.getElementById('maTuyen').value,
                maXe: document.getElementById('maXe').value,
                benDen: document.getElementById('benDen').value,
                thoiGianKhoiHanh: document.getElementById('thoiGianKhoiHanh').value,
                giaVe: document.getElementById('giaVe').value,
                trangThai: document.getElementById('trangThai').value
            };

            let url = `${API_URL}/chuyen-xe`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert(id ? 'Cập nhật xong' : 'Lên lịch xong');
                    bootstrap.Modal.getInstance(document.getElementById('chuyenModal')).hide();
                    loadChuyen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch(e) { console.error(e); }
        });

        // 8. Delete
        async function deleteChuyen(id) {
            if(!confirm('Xóa chuyến này?')) return;
            const res = await fetch(`${API_URL}/chuyen-xe/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) loadChuyen();
            else alert('Lỗi khi xóa');
        }

        loadDropdowns();
        loadChuyen();
    </script>
</body>
</html>
