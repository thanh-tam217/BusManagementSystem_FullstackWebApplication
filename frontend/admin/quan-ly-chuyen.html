        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') window.location.href = '/login.html';
        document.getElementById('station-admin-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;

        let allChuyen = [];

        function formatDateTimeForInput(isoString) {
            const date = new Date(isoString);
            date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
            return date.toISOString().slice(0, 16);
        }

        // Hàm format ngày giờ đẹp cho bảng
        function formatDateTimeDisplay(isoString) {
            if(!isoString) return '--';
            const date = new Date(isoString);
            return date.toLocaleString('vi-VN', { 
                hour: '2-digit', minute: '2-digit', 
                day: '2-digit', month: '2-digit', year: 'numeric' 
            });
        }

        // 1. Load Chuyến (Chạy trước để có dữ liệu lọc tài xế)
        async function loadChuyen() {
            try {
                const res = await fetch(`${API_URL}/chuyen-xe`, { headers: { 'Authorization': `Bearer ${token}` }});
                allChuyen = await res.json();
                renderTable(allChuyen);
            } catch (e) { console.error(e); }
        }

        
        // 2. Load Dropdowns (Tuyến, Xe, Tỉnh, TÀI XẾ)
        async function loadDropdowns() {
            try {
                const resBen = await fetch(`${API_URL}/ben-xe`);
                allBen = await resBen.json();

                let idTinhCuaAdmin = null;
                if (user.vaiTro === 'AdminBenXe' && user.maBenQuanLy) {
                    const myStation = allBen.find(b => b._id === user.maBenQuanLy);
                    if (myStation && myStation.maTinh) {
                        idTinhCuaAdmin = myStation.maTinh._id;
                    }
                }

                // Load Tuyến
                const resTuyen = await fetch(`${API_URL}/tuyen-xe`, { headers: { 'Authorization': `Bearer ${token}` }});
                allTuyen = await resTuyen.json();
                const selectTuyen = document.getElementById('maTuyen');
                selectTuyen.innerHTML = '<option value="">-- Chọn tuyến --</option>';
                allTuyen.forEach(t => {
                    if (idTinhCuaAdmin && t.diemDi && t.diemDi._id !== idTinhCuaAdmin) return;
                    const tenTinhDi = t.diemDi ? t.diemDi.tenTinh : 'Unknown';
                    const tenTinhDen = t.diemDen ? t.diemDen.tenTinh : 'Unknown';
                    selectTuyen.innerHTML += `<option value="${t._id}">${tenTinhDi} -> ${tenTinhDen}</option>`;
                });

                // Load Xe
                const resXe = await fetch(`${API_URL}/xe`, { headers: { 'Authorization': `Bearer ${token}` }});
                const dataXe = await resXe.json();
                const selectXe = document.getElementById('maXe');
                selectXe.innerHTML = '<option value="">-- Chọn xe --</option>';
                dataXe.forEach(x => selectXe.innerHTML += `<option value="${x._id}">${x.bienSo} (${x.loaiXe})</option>`);

                // Load Tỉnh vào Filter
                const resTinh = await fetch(`${API_URL}/tinh-thanh`);
                const dataTinh = await resTinh.json();
                const optTinh = dataTinh.map(t => `<option value="${t._id}">${t.tenTinh}</option>`).join('');
                document.getElementById('filterTinhDi').innerHTML += optTinh;
                document.getElementById('filterTinhDen').innerHTML += optTinh;

                // [MỚI] Load Tài Xế
                const resUsers = await fetch(`${API_URL}/users`, { headers: { 'Authorization': `Bearer ${token}` }});
                const dataUsers = await resUsers.json();
                // Lọc lấy những người là 'TaiXe'
                allTaiXe = dataUsers.filter(u => u.vaiTro === 'TaiXe');
                
            } catch (e) { console.error(e); }
        }

        // [MỚI] Hàm cập nhật Dropdown Tài xế (Chỉ hiện người rảnh)
        function updateTaiXeDropdown(currentTaiXeId = null) {
            const selectTaiXe = document.getElementById('maTaiXe');
            selectTaiXe.innerHTML = '<option value="">-- Chọn tài xế --</option>';

            // Lấy danh sách ID tài xế đang bận (Đang ở trạng thái DangCho hoặc DangDi)
            const busyDriverIds = allChuyen
                .filter(c => (c.trangThai === 'DangCho' || c.trangThai === 'DangDi') && c.maTaiXe)
                .map(c => c.maTaiXe._id || c.maTaiXe); // Handle populate or ID string

            allTaiXe.forEach(tx => {
                // Nếu tài xế này đang bận VÀ không phải là tài xế của chuyến đang sửa -> Bỏ qua
                // (currentTaiXeId dùng cho trường hợp đang sửa chuyến, cần hiện lại tài xế cũ dù họ đang status DangCho của chính chuyến này)
                if (busyDriverIds.includes(tx._id) && tx._id !== currentTaiXeId) {
                    return; 
                }
                selectTaiXe.innerHTML += `<option value="${tx._id}">${tx.hoTen} (${tx.soDienThoai})</option>`;
            });
        }

        function filterBenDenByTuyen() {
            const tuyenId = document.getElementById('maTuyen').value;
            const selectBenDen = document.getElementById('benDen');
            selectBenDen.innerHTML = '<option value="">-- Chọn bến đích --</option>';
            if (!tuyenId) return;
            const selectedTuyen = allTuyen.find(t => t._id === tuyenId);
            if (!selectedTuyen || !selectedTuyen.diemDen) return;
            const idTinhDen = selectedTuyen.diemDen._id; 
            const validBens = allBen.filter(b => b.maTinh && b.maTinh._id === idTinhDen);
            validBens.forEach(b => {
                selectBenDen.innerHTML += `<option value="${b._id}">${b.tenBen}</option>`;
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-chuyen');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Không tìm thấy dữ liệu</td></tr>';
                return;
            }

            data.forEach(c => {
                const timeStart = formatDateTimeDisplay(c.thoiGianKhoiHanh);
                const timeEnd = formatDateTimeDisplay(c.thoiGianDuKienDen);
                const gia = new Intl.NumberFormat('vi-VN').format(c.giaVe);
                
                const tenBenDi = c.benKhoiHanh ? c.benKhoiHanh.tenBen : 'Bến đi (?)';
                const tenBenDen = c.benDen ? c.benDen.tenBen : 'Bến đến (?)';
                const taiXe = c.maTaiXe ? c.maTaiXe.hoTen : '<span class="text-danger">Chưa gán</span>';
                
                // Xử lý hiển thị tên tuyến
                let tenTuyenText = '<span class="text-danger small">Lỗi tuyến</span>';
                if (c.maTuyen) {
                    const idTuyen = c.maTuyen._id || c.maTuyen;
                    const fullTuyen = allTuyen.find(t => t._id === idTuyen);
                    if (fullTuyen && fullTuyen.diemDi && fullTuyen.diemDen) {
                        tenTuyenText = `${fullTuyen.diemDi.tenTinh} <i class="fa-solid fa-arrow-right mx-1 small"></i> ${fullTuyen.diemDen.tenTinh}`;
                    }
                }

                // --- LOGIC MÀU SẮC TRẠNG THÁI (MỚI) ---
                let statusConfig = { text: 'Không rõ', css: 'badge-gradient-blue' };

                switch (c.trangThai) {
                    case 'DangCho':
                        statusConfig = { text: 'Sắp chạy', css: 'badge-gradient-blue' };
                        break;
                    case 'DangDi':
                        statusConfig = { text: 'Đang đi', css: 'badge-gradient-green' };
                        break;
                    case 'DaKetThuc':
                        statusConfig = { text: 'Đã kết thúc', css: 'badge-gradient-cam' };
                        break;
                    case 'Huy':
                        statusConfig = { text: 'Đã hủy', css: 'badge-gradient-red' };
                        break;
                }

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="fw-bold text-primary">${tenBenDi} <i class="fa-solid fa-arrow-right small text-dark"></i> ${tenBenDen}</div>
                            <small class="text-muted">${tenTuyenText}</small>
                        </td>
                        <td>
                            <div class="fw-bold">${c.maXe ? c.maXe.bienSo : 'Xe đã xóa'}</div>
                            <small class="text-muted"><i class="fa-solid fa-user-tie me-1"></i>${taiXe}</small>
                        </td>
                        <td class="fw-bold">${timeStart}</td>
                        <td class="text-muted">${timeEnd}</td>
                        <td class="text-success fw-bold">${gia} đ</td>
                        <td>
                            <span class="badge-gradient-base ${statusConfig.css}">
                                ${statusConfig.text}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${c._id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteChuyen('${c._id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // [MỚI] Hàm kiểm tra ngày không được ở quá khứ
        function setMinDate() {
            const now = new Date();
            // Format thành yyyy-MM-ddThh:mm để gán vào input datetime-local
            // Lưu ý: Cần chỉnh múi giờ cho đúng nếu không sẽ bị lệch
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('thoiGianKhoiHanh').min = now.toISOString().slice(0, 16);
        }

        function openAddModal() {
            document.getElementById('chuyenForm').reset();
            document.getElementById('chuyenId').value = '';
            document.getElementById('modalTitle').innerText = 'Lên Lịch Chuyến Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            document.getElementById('benDen').innerHTML = '<option value="">-- Vui lòng chọn tuyến trước --</option>';
            
            updateTaiXeDropdown(); // Load danh sách tài xế rảnh
            setMinDate(); // [MỚI] Chặn ngày quá khứ

            new bootstrap.Modal(document.getElementById('chuyenModal')).show();
        }

        function openEditModal(id) {
            const c = allChuyen.find(x => x._id === id);
            if(!c) return;

            document.getElementById('chuyenId').value = c._id;
            
            // Xử lý tuyến & bến
            const idTuyen = c.maTuyen._id || c.maTuyen;
            document.getElementById('maTuyen').value = idTuyen;
            filterBenDenByTuyen();
            
            document.getElementById('maXe').value = c.maXe ? (c.maXe._id || c.maXe) : '';
            document.getElementById('benDen').value = c.benDen ? (c.benDen._id || c.benDen) : '';
            document.getElementById('giaVe').value = c.giaVe;
            document.getElementById('trangThai').value = c.trangThai;
            document.getElementById('thoiGianKhoiHanh').value = formatDateTimeForInput(c.thoiGianKhoiHanh);
            
            // Load tài xế (truyền ID hiện tại vào để không bị ẩn chính tài xế đó)
            const idTaiXe = c.maTaiXe ? (c.maTaiXe._id || c.maTaiXe) : null;
            updateTaiXeDropdown(idTaiXe);
            document.getElementById('maTaiXe').value = idTaiXe;

            setMinDate(); // Vẫn chặn ngày quá khứ khi sửa (tùy nhu cầu, có thể bỏ nếu muốn sửa chuyến cũ)

            document.getElementById('modalTitle').innerText = 'Cập Nhật Chuyến';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('chuyenModal')).show();
        }

        document.getElementById('chuyenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('chuyenId').value;
            const data = {
                maTuyen: document.getElementById('maTuyen').value,
                maXe: document.getElementById('maXe').value,
                maTaiXe: document.getElementById('maTaiXe').value, // [MỚI]
                benDen: document.getElementById('benDen').value,
                thoiGianKhoiHanh: document.getElementById('thoiGianKhoiHanh').value,
                giaVe: document.getElementById('giaVe').value,
                trangThai: document.getElementById('trangThai').value
            };

            let url = `${API_URL}/chuyen-xe`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('Lưu thành công');
                    bootstrap.Modal.getInstance(document.getElementById('chuyenModal')).hide();
                    
                    // Reload lại toàn bộ để cập nhật danh sách và trạng thái tài xế
                    loadChuyen().then(() => {
                        // Sau khi reload chuyến xong thì reload lại dropdown tài xế (nếu modal còn mở)
                    });
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch(e) { console.error(e); }
        });

        async function deleteChuyen(id) {
            if(!confirm('Xóa chuyến này?')) return;
            const res = await fetch(`${API_URL}/chuyen-xe/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) loadChuyen();
            else alert('Lỗi khi xóa');
        }

        function filterChuyen() { 
            const tinhDi = document.getElementById('filterTinhDi').value;
            const tinhDen = document.getElementById('filterTinhDen').value;

            const filtered = allChuyen.filter(c => {
                let matchDi = true;
                let matchDen = true;

                if(tinhDi) {
                    const idTuyen = c.maTuyen._id || c.maTuyen;
                    const fullTuyen = allTuyen.find(t => t._id === idTuyen);
                    if(fullTuyen && fullTuyen.diemDi) {
                        matchDi = fullTuyen.diemDi._id === tinhDi;
                    } else {
                        matchDi = false;
                    }
                }

                if(tinhDen) {
                    const idTuyen = c.maTuyen._id || c.maTuyen;
                    const fullTuyen = allTuyen.find(t => t._id === idTuyen);
                    if(fullTuyen && fullTuyen.diemDen) {
                        matchDen = fullTuyen.diemDen._id === tinhDen;
                    } else {
                        matchDen = false;
                    }
                }

                return matchDi && matchDen;
            });

            renderTable(filtered);      
        }
        function resetFilter() {
            document.getElementById('filterTinhDi').value = '';
            document.getElementById('filterTinhDen').value = '';
            renderTable(allChuyen);
        }
        // Logic khởi chạy: Load Dropdown (để lấy danh sách tài xế, xe, tuyến) -> Sau đó Load Chuyến (để biết ai bận)
        loadDropdowns().then(() => {
            loadChuyen();
        });
    </script>
</body>
</html>
