<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đội Xe - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus me-2"></i> STATION
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-station.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span class="menu-title">Tổng quan bến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-xe.html">
                    <i class="fa-solid fa-bus-simple"></i>
                    <span class="menu-title">Quản lý xe</span>
                </a>
            </li>
            <!-- <li class="nav-item">
                <a class="nav-link" href="quan-ly-tuyen.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="menu-title">Quản lý tuyến xe</span>
                </a>
            </li> -->
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-chuyen.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span class="menu-title">Lịch trình chuyến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-nhan-vien.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span class="menu-title">Nhân viên</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars text-secondary fs-4 me-3 d-lg-none"></i>
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" class="form-control" id="searchXe" placeholder="Tìm biển số xe..." onkeyup="filterXe()">
                </div>
            </div>
            <div class="d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Trưởng bến</p>
                    <small class="text-muted">Trưởng bến</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=Station+Admin&background=047edf&color=fff" class="rounded-circle" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-danger text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-bus"></i>
                    </span> Quản lý Đội Xe
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Xe Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Biển số</th>
                                    <th>Loại xe</th>
                                    <th>Số ghế</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-xe">
                                <tr><td colspan="5" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="xeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="xeForm">
                        <input type="hidden" id="xeId"> 
                        <div class="mb-3">
                            <label class="form-label">Biển số xe</label>
                            <input type="text" class="form-control" id="bienSo" required placeholder="Ví dụ: 29B-123.45">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Loại xe</label>
                                <select class="form-select" id="loaiXe">
                                    <option value="Giường nằm">Giường nằm</option>
                                    <option value="Ghế ngồi">Ghế ngồi</option>
                                    <option value="Limousine">Limousine</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số ghế</label>
                                <input type="number" class="form-control" id="soGhe" value="40" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" id="trangThai">
                                <option value="DangCho">Sẵn sàng (Đang chờ)</option>
                                <option value="BaoDuong">Đang bảo dưỡng</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminBenXe') {
             window.location.href = '/login.html';
        }
        document.getElementById('user-name').innerText = user.hoTen;
        
        let allXe = [];

        // 1. Load danh sách Xe
        async function loadXe() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_URL}/xe`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allXe = await res.json();
                renderTable(allXe);
            } catch (e) { console.error(e); }
        }

        // 2. Render Bảng
        function renderTable(data) {
            const tbody = document.getElementById('table-xe');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Chưa có xe nào</td></tr>';
                return;
            }

            data.forEach(xe => {
                let statusBadge = xe.trangThai === 'DangCho' 
                    ? '<label class="badge badge-gradient-success">Sẵn sàng</label>' 
                    : '<label class="badge badge-gradient-warning text-dark">Bảo dưỡng</label>';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">${xe.bienSo}</td>
                        <td>${xe.loaiXe}</td>
                        <td>${xe.soGhe} ghế</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${xe._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteXe('${xe._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Tìm kiếm
        function filterXe() {
            const keyword = document.getElementById('searchXe').value.toLowerCase();
            const filtered = allXe.filter(x => x.bienSo.toLowerCase().includes(keyword));
            renderTable(filtered);
        }

        // 4. Modal Thêm
        window.openAddModal = function() {
            document.getElementById('xeForm').reset();
            document.getElementById('xeId').value = ''; 
            document.getElementById('modalTitle').innerText = 'Thêm Xe Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('xeModal')).show();
        }

        // 5. Modal Sửa
        window.openEditModal = function(id) {
            const xe = allXe.find(x => x._id === id);
            if (!xe) return;

            document.getElementById('xeId').value = xe._id;
            document.getElementById('bienSo').value = xe.bienSo;
            document.getElementById('loaiXe').value = xe.loaiXe;
            document.getElementById('soGhe').value = xe.soGhe;
            document.getElementById('trangThai').value = xe.trangThai;

            document.getElementById('modalTitle').innerText = 'Cập Nhật Xe';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('xeModal')).show();
        }

        // 6. Submit
        document.getElementById('xeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('xeId').value;
            const token = localStorage.getItem('token');
            const data = {
                bienSo: document.getElementById('bienSo').value,
                loaiXe: document.getElementById('loaiXe').value,
                soGhe: document.getElementById('soGhe').value,
                trangThai: document.getElementById('trangThai').value
            };

            let url = `${API_URL}/xe`;
            let method = 'POST';

            if (id) {
                url = `${API_URL}/xe/${id}`;
                method = 'PUT';
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(id ? 'Cập nhật thành công!' : 'Thêm xe thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('xeModal')).hide();
                    loadXe(); 
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        // 7. Xóa
        async function deleteXe(id) {
            if(!confirm('Bạn có chắc muốn xóa xe này?')) return;
            const token = localStorage.getItem('token');
            const res = await fetch(`${API_URL}/xe/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) {
                loadXe();
            } else {
                alert('Không thể xóa xe (Có thể xe đang chạy chuyến)');
            }
        }

        loadXe();
    </script>
</body>
</html>
