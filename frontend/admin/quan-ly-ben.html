<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bến Xe - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus-simple me-2"></i> THT BUSLINE
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-system.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="menu-title">Tổng quan</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-tinh.html">
                    <i class="fa-solid fa-city"></i>
                    <span class="menu-title">Quản lý Tỉnh</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-ben.html">
                    <i class="fa-solid fa-landmark"></i>
                    <span class="menu-title">Quản lý Bến xe</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-tuyen.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="menu-title">Quản lý Tuyến</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-user.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-title">Người dùng</span>
                </a>
            </li>

            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars text-secondary fs-4 me-3 d-lg-none"></i>
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" class="form-control" placeholder="Tìm kiếm...">
                </div>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Admin</p>
                    <small class="text-muted">Quản trị viên</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=System+Admin&background=9a55ff&color=fff" class="rounded-circle" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-primary text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-landmark"></i>
                    </span> Quản lý Bến Xe
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Bến Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    
                    <div class="row g-2 mb-4 align-items-end">
                        <div class="col-md-4">
                            <label class="small text-muted fw-bold">Lọc theo Tỉnh</label>
                            <select class="form-select bg-light border-0" id="filterTinh">
                                <option value="">-- Tất cả Tỉnh/Thành --</option>
                                </select>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted fw-bold">Tìm kiếm chung</label>
                            <input type="text" class="form-control bg-light border-0" id="searchKeyword" placeholder="Nhập tên bến, địa chỉ, người quản lý...">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-inverse-info w-100 fw-bold" onclick="filterBen()">
                                <i class="fa-solid fa-search me-1"></i> Tìm
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tên Bến</th>
                                    <th>Tỉnh / Thành phố</th>
                                    <th>Admin Quản Lý</th> <th>Địa chỉ / SĐT</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-ben">
                                <tr><td colspan="5" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="benModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Bến Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="benForm">
                        <input type="hidden" id="benId">
                        
                        <div class="mb-3">
                            <label class="form-label">Tên Bến</label>
                            <input type="text" class="form-control" id="tenBen" required placeholder="VD: Bến xe Mỹ Đình">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Thuộc Tỉnh/Thành</label>
                            <select class="form-select" id="select-tinh" required>
                                <option value="">-- Chọn tỉnh --</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" id="diaChi" required placeholder="VD: 20 Phạm Hùng">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="soDienThoai" placeholder="VD: 0243xxxxxx">
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;
        const token = localStorage.getItem('token');

        let allBen = [];
        let allAdmins = []; // Danh sách Admin bến xe

        // 1. Load Dữ liệu nền (Tỉnh & User Admin)
        async function loadDataNen() {
            try {
                // a. Load Tỉnh vào Dropdown Lọc và Modal
                const resTinh = await fetch(`${API_URL}/tinh-thanh`);
                const dataTinh = await resTinh.json();
                
                const selectFilter = document.getElementById('filterTinh');
                const selectModal = document.getElementById('select-tinh');
                
                dataTinh.forEach(tinh => {
                    const opt = `<option value="${tinh._id}">${tinh.tenTinh}</option>`;
                    selectFilter.innerHTML += opt;
                    selectModal.innerHTML += opt;
                });

                // b. Load Danh sách Admin Bến (để map tên)
                const resUsers = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dataUsers = await resUsers.json();
                // Lọc lấy những người là AdminBenXe
                allAdmins = dataUsers.filter(u => u.vaiTro === 'AdminBenXe');

            } catch (e) { console.error(e); }
        }

        // 2. Load Danh sách Bến
        async function loadBen() {
            try {
                const res = await fetch(`${API_URL}/ben-xe`);
                allBen = await res.json();
                renderTable(allBen);
            } catch (e) { console.error(e); }
        }

        // 3. Render Table (Có map tên Admin)
        function renderTable(data) {
            const tbody = document.getElementById('table-ben');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Không tìm thấy bến xe nào</td></tr>';
                return;
            }

            data.forEach(ben => {
                const tenTinh = ben.maTinh ? ben.maTinh.tenTinh : '<span class="text-danger">Chưa gán</span>';
                
                // Logic tìm Admin quản lý bến này
                // Tìm trong danh sách allAdmins xem ai có maBenQuanLy._id trùng với ben._id
                const admin = allAdmins.find(u => u.maBenQuanLy && u.maBenQuanLy._id === ben._id);
                const tenAdmin = admin ? 
                    `<span class="text-success fw-bold"><i class="fa-solid fa-user-shield me-1"></i>${admin.hoTen}</span>` : 
                    `<span class="badge bg-light text-muted border">Chưa có Admin</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">${ben.tenBen}</td>
                        <td><span class="badge bg-inverse-info text-dark">${tenTinh}</span></td>
                        <td>${tenAdmin}</td>
                        <td>
                            <div>${ben.diaChi}</div>
                            <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${ben.soDienThoai || '---'}</small>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${ben._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteBen('${ben._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Lọc & Tìm kiếm
        function filterBen() {
            const tinhId = document.getElementById('filterTinh').value;
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();

            const filtered = allBen.filter(ben => {
                // Lọc theo tỉnh
                // Lưu ý: ben.maTinh là object (do populate), cần lấy ._id
                const idTinhDB = ben.maTinh ? ben.maTinh._id : '';
                const matchTinh = (tinhId === "") || (idTinhDB === tinhId);

                // Lọc theo từ khóa (Tên bến, Địa chỉ, hoặc Tên Admin)
                // Tìm tên admin của bến này để search luôn
                const admin = allAdmins.find(u => u.maBenQuanLy && u.maBenQuanLy._id === ben._id);
                const adminName = admin ? admin.hoTen : '';

                const textData = (ben.tenBen + ben.diaChi + adminName).toLowerCase();
                const matchKeyword = textData.includes(keyword);

                return matchTinh && matchKeyword;
            });
            renderTable(filtered);
        }

        // 5. Modal Add
        function openAddModal() {
            document.getElementById('benForm').reset();
            document.getElementById('benId').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm Bến Xe Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('benModal')).show();
        }

        // 6. Modal Edit
        function openEditModal(id) {
            const ben = allBen.find(b => b._id === id);
            if (!ben) return;

            document.getElementById('benId').value = ben._id;
            document.getElementById('tenBen').value = ben.tenBen;
            document.getElementById('diaChi').value = ben.diaChi;
            document.getElementById('soDienThoai').value = ben.soDienThoai;
            if(ben.maTinh) document.getElementById('select-tinh').value = ben.maTinh._id;

            document.getElementById('modalTitle').innerText = 'Cập Nhật Bến Xe';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('benModal')).show();
        }

        // 7. Submit
        document.getElementById('benForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('benId').value;
            const data = {
                tenBen: document.getElementById('tenBen').value,
                maTinh: document.getElementById('select-tinh').value,
                diaChi: document.getElementById('diaChi').value,
                soDienThoai: document.getElementById('soDienThoai').value
            };

            let url = `${API_URL}/ben-xe`;
            let method = 'POST';
            if (id) { url += `/${id}`; method = 'PUT'; }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(id ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('benModal')).hide();
                    loadBen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        // 8. Delete
        async function deleteBen(id) {
            if(!confirm('Bạn có chắc chắn xóa bến xe này? (Hành động này có thể ảnh hưởng đến các chuyến xe)')) return;
            const res = await fetch(`${API_URL}/ben-xe/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) {
                alert('Đã xóa bến xe');
                loadBen();
            } else alert('Lỗi khi xóa');
        }

        // Chạy lần đầu
        // Phải load Data nền trước (Tỉnh, User) rồi mới load Bến để map dữ liệu
        loadDataNen().then(() => {
            loadBen();
        });
    </script>
</body>
</html>
