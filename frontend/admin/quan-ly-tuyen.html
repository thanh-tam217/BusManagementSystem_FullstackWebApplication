    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">

        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">

                    <i class="fa-solid fa-house"></i>
                    <span class="menu-title">Tổng quan</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-tinh.html">
                    <i class="fa-solid fa-city"></i>
                    <span class="menu-title">Quản lý Tỉnh</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-ben.html">
                    <i class="fa-solid fa-landmark"></i>
                    <span class="menu-title">Quản lý Bến xe</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-tuyen.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="menu-title">Quản lý Tuyến</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-user.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-title">Người dùng</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="profile-system.html">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="menu-title">Thông tin cá nhân</span>
                </a>
            </li>

            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars text-secondary fs-4 me-3 d-lg-none"></i>
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" class="form-control" placeholder="Tìm kiếm...">
                </div>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Admin</p>
                    <small class="text-muted">Quản trị viên</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=User&background=random&size=128" class="rounded-circle img-fluid border border-3 border-light shadow" id="profile-avatar-header" style="width: 40px;">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold mb-0" style="color: #0081a7;">
                    <i class="fa-solid fa-map-location-dot"></i> Quản lý tuyến xe
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Tuyến Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    
                    <div class="row g-2 mb-4 align-items-end">
                        <div class="col-md-5">
                            <label class="small text-muted fw-bold">Điểm Đi</label>
                            <select class="form-select bg-light border-0" id="filterDiemDi">
                                <option value="">-- Tất cả --</option>
                                </select>
                        </div>
                        <div class="col-md-5">
                            <label class="small text-muted fw-bold">Điểm Đến</label>
                            <select class="form-select bg-light border-0" id="filterDiemDen">
                                <option value="">-- Tất cả --</option>
                                </select>
                        </div>
                        
                        <div class="col-md-2">
                            <button class="btn btn-secondary fw-bold" onclick="resetFilter()">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                            <button class="btn btn-inverse-info flex-grow-1 fw-bold" onclick="filterTuyen()">
                                <i class="fa-solid fa-search me-1"></i> Tìm
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tên Tuyến (Đi - Đến)</th>
                                    <th>Thời gian</th>
                                    <th>Quãng đường</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-tuyen">
                                <tr><td colspan="4" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tuyenModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Tuyến Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tuyenForm">
                        <input type="hidden" id="tuyenId">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đi (Tỉnh)</label>
                                <select class="form-select" id="diemDi" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đến (Tỉnh)</label>
                                <select class="form-select" id="diemDen" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thời gian (Giờ)</label>
                                <input type="number" class="form-control" id="thoiGian" required placeholder="VD: 5">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quãng đường (Km)</label>
                                <input type="number" class="form-control" id="quangDuong" required placeholder="VD: 300">
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;

        let allTuyen = [];

        // 1. Load danh sách Tỉnh
        async function loadDropdownTinh() {
            try {
                const res = await fetch(`${API_URL}/tinh-thanh`);
                const data = await res.json();
                
                const selectDi = document.getElementById('diemDi');
                const selectDen = document.getElementById('diemDen');
                const filterDi = document.getElementById('filterDiemDi');
                const filterDen = document.getElementById('filterDiemDen');
                
                data.forEach(tinh => {
                    const opt = `<option value="${tinh._id}">${tinh.tenTinh}</option>`;
                    selectDi.innerHTML += opt;
                    selectDen.innerHTML += opt;
                    filterDi.innerHTML += opt;
                    filterDen.innerHTML += opt;
                });
            } catch (e) { console.error(e); }
        }

        // 2. Load danh sách Tuyến Xe
        async function loadTuyen() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/tuyen-xe`, {
                     headers: { 'Authorization': `Bearer ${token}` }
                });
                allTuyen = await res.json();
                renderTable(allTuyen);
            } catch (e) { console.error(e); }
        }

        // 3. Render Table
        function renderTable(data) {
            const tbody = document.getElementById('table-tuyen');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Không tìm thấy tuyến nào</td></tr>';
                return;
            }

            data.forEach(tuyen => {
                const tenDi = tuyen.diemDi ? tuyen.diemDi.tenTinh : '<span class="text-danger">Unknown</span>';
                const tenDen = tuyen.diemDen ? tuyen.diemDen.tenTinh : '<span class="text-danger">Unknown</span>';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">
                            ${tenDi} <i class="fa-solid fa-arrow-right mx-2 text-muted"></i> ${tenDen}
                        </td>
                        <td>${tuyen.thoiGianDiChuyen} giờ</td>
                        <td>${tuyen.quangDuong} km</td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${tuyen._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteTuyen('${tuyen._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Lọc Tuyến
        function filterTuyen() {
            const diId = document.getElementById('filterDiemDi').value;
            const denId = document.getElementById('filterDiemDen').value;

            const filtered = allTuyen.filter(t => {
                const idDi = t.diemDi ? t.diemDi._id : '';
                const idDen = t.diemDen ? t.diemDen._id : '';
                const matchDi = diId === "" || idDi === diId;
                const matchDen = denId === "" || idDen === denId;
                return matchDi && matchDen;
            });
            renderTable(filtered);
        }

        // 5. Reset Filter (MỚI THÊM)
        function resetFilter() {
            // Xóa giá trị chọn
            document.getElementById('filterDiemDi').value = "";
            document.getElementById('filterDiemDen').value = "";
            // Render lại toàn bộ danh sách gốc
            renderTable(allTuyen);
        }

        // --- CÁC HÀM MODAL & SUBMIT GIỮ NGUYÊN ---
        window.openAddModal = function() {
            document.getElementById('tuyenForm').reset();
            document.getElementById('tuyenId').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm Tuyến Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('tuyenModal')).show();
        }

        window.openEditModal = function(id) {
            const tuyen = allTuyen.find(t => t._id === id);
            if (!tuyen) return;

            document.getElementById('tuyenId').value = tuyen._id;
            if(tuyen.diemDi) document.getElementById('diemDi').value = tuyen.diemDi._id;
            if(tuyen.diemDen) document.getElementById('diemDen').value = tuyen.diemDen._id;
            document.getElementById('thoiGian').value = tuyen.thoiGianDiChuyen;
            document.getElementById('quangDuong').value = tuyen.quangDuong;

            document.getElementById('modalTitle').innerText = 'Cập Nhật Tuyến';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('tuyenModal')).show();
        }

        

        document.getElementById('tuyenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tuyenId').value;
            const token = localStorage.getItem('token');
            const diemDi = document.getElementById('diemDi').value;
            const diemDen = document.getElementById('diemDen').value;
            
            if (diemDi === diemDen) { alert('Điểm đi và Điểm đến không được trùng nhau!'); return; }

            const data = {
                diemDi: diemDi,
                diemDen: diemDen,
                thoiGianDiChuyen: document.getElementById('thoiGian').value,
                quangDuong: document.getElementById('quangDuong').value
            };

            let url = `${API_URL}/tuyen-xe`;
            let method = 'POST';
            if (id) { url += `/${id}`; method = 'PUT'; } // Dùng PUT nếu có ID

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('tuyenModal')).hide();
                    loadTuyen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });



        async function deleteTuyen(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa tuyến này?')) return;
            const token = localStorage.getItem('token');

            try {
                const res = await fetch(`${API_URL}/tuyen-xe/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('Xóa thành công!');
                    loadTuyen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        }

        loadDropdownTinh();
        loadTuyen();
    </script>
</body>
</html>
