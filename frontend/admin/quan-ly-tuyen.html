<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tuyến - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus-simple me-2"></i> SYSTEM ADMIN
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-system.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="menu-title">Tổng quan</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-tinh.html">
                    <i class="fa-solid fa-city"></i>
                    <span class="menu-title">Quản lý Tỉnh</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-ben.html">
                    <i class="fa-solid fa-landmark"></i>
                    <span class="menu-title">Quản lý Bến xe</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-tuyen.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="menu-title">Quản lý Tuyến</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="quan-ly-user.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-title">Người dùng</span>
                </a>
            </li>

            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars text-secondary fs-4 me-3 d-lg-none"></i>
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" class="form-control" placeholder="Tìm kiếm tuyến xe...">
                </div>
            </div>
            <div class="d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="user-name">Admin</p>
                    <small class="text-muted">Quản trị viên</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=System+Admin&background=9a55ff&color=fff" class="rounded-circle" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-info text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </span> Quản lý Tuyến Đường
                </h3>
                <button class="btn btn-gradient-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Tuyến Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tên Tuyến (Đi - Đến)</th>
                                    <th>Thời gian</th>
                                    <th>Quãng đường</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-tuyen">
                                <tr><td colspan="4" class="text-center">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tuyenModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thêm Tuyến Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tuyenForm">
                        <input type="hidden" id="tuyenId">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đi (Tỉnh)</label>
                                <select class="form-select" id="diemDi" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đến (Tỉnh)</label>
                                <select class="form-select" id="diemDen" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thời gian (Giờ)</label>
                                <input type="number" class="form-control" id="thoiGian" required placeholder="VD: 5">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quãng đường (Km)</label>
                                <input type="number" class="form-control" id="quangDuong" required placeholder="VD: 300">
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;

        let allTuyen = [];

        // 1. Load danh sách Tỉnh vào 2 Dropdown
        async function loadDropdownTinh() {
            try {
                const res = await fetch(`${API_URL}/tinh-thanh`);
                const data = await res.json();
                const selectDi = document.getElementById('diemDi');
                const selectDen = document.getElementById('diemDen');
                
                data.forEach(tinh => {
                    const option = `<option value="${tinh._id}">${tinh.tenTinh}</option>`;
                    selectDi.innerHTML += option;
                    selectDen.innerHTML += option;
                });
            } catch (e) { console.error(e); }
        }

        // 2. Load danh sách Tuyến Xe
        async function loadTuyen() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/tuyen-xe`, {
                     headers: { 'Authorization': `Bearer ${token}` }
                });
                allTuyen = await res.json();
                
                const tbody = document.getElementById('table-tuyen');
                tbody.innerHTML = '';
                
                allTuyen.forEach(tuyen => {
                    const tenDi = tuyen.diemDi ? tuyen.diemDi.tenTinh : '<span class="text-danger">Unknown</span>';
                    const tenDen = tuyen.diemDen ? tuyen.diemDen.tenTinh : '<span class="text-danger">Unknown</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold text-primary">
                                ${tenDi} <i class="fa-solid fa-arrow-right mx-2 text-muted"></i> ${tenDen}
                            </td>
                            <td>${tuyen.thoiGianDiChuyen} giờ</td>
                            <td>${tuyen.quangDuong} km</td>
                            <td>
                                <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${tuyen._id}')">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="alert('Chức năng xóa đang phát triển')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        // 3. Mở Modal Thêm
        window.openAddModal = function() {
            document.getElementById('tuyenForm').reset();
            document.getElementById('tuyenId').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm Tuyến Mới';
            document.getElementById('btnSave').innerText = 'Lưu lại';
            new bootstrap.Modal(document.getElementById('tuyenModal')).show();
        }

        // 4. Mở Modal Sửa
        window.openEditModal = function(id) {
            const tuyen = allTuyen.find(t => t._id === id);
            if (!tuyen) return;

            document.getElementById('tuyenId').value = tuyen._id;
            // Chọn đúng tỉnh trong dropdown (lưu ý: diemDi là object)
            if(tuyen.diemDi) document.getElementById('diemDi').value = tuyen.diemDi._id;
            if(tuyen.diemDen) document.getElementById('diemDen').value = tuyen.diemDen._id;
            
            document.getElementById('thoiGian').value = tuyen.thoiGianDiChuyen;
            document.getElementById('quangDuong').value = tuyen.quangDuong;

            document.getElementById('modalTitle').innerText = 'Cập Nhật Tuyến';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('tuyenModal')).show();
        }

        // 5. Xử lý Submit
        document.getElementById('tuyenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tuyenId').value;
            const token = localStorage.getItem('token');
            
            const diemDi = document.getElementById('diemDi').value;
            const diemDen = document.getElementById('diemDen').value;
            
            if (diemDi === diemDen) {
                alert('Điểm đi và Điểm đến không được trùng nhau!');
                return;
            }

            const data = {
                diemDi: diemDi,
                diemDen: diemDen,
                thoiGianDiChuyen: document.getElementById('thoiGian').value,
                quangDuong: document.getElementById('quangDuong').value
            };

            let url = `${API_URL}/tuyen-xe`;
            let method = 'POST';

            if (id) {
                // url += `/${id}`;
                // method = 'PUT';
                alert("Bạn cần viết API Cập nhật Tuyến bên Backend trước!");
                return;
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Lưu thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('tuyenModal')).hide();
                    loadTuyen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        loadDropdownTinh();
        loadTuyen();
    </script>
</body>
</html>
