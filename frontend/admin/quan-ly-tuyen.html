<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tuyến - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus me-2"></i> STATION
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-station.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span class="menu-title">Tổng quan bến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-xe.html">
                    <i class="fa-solid fa-bus-simple"></i>
                    <span class="menu-title">Đội xe</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-tuyen.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="menu-title">Tuyến đường</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-chuyen.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span class="menu-title">Lịch trình chuyến</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-nhan-vien.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span class="menu-title">Nhân viên</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="user-name">Trưởng bến</span>
                <img src="https://ui-avatars.com/api/?name=Station+Admin&background=047edf&color=fff" class="rounded-circle" width="35">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-info text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </span> Quản lý Tuyến Đường
                </h3>
                <button class="btn btn-gradient-primary" data-bs-toggle="modal" data-bs-target="#addTuyenModal">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Tuyến Mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tên Tuyến</th>
                                    <th>Thời gian</th>
                                    <th>Quãng đường</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-tuyen">
                                <tr><td colspan="4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addTuyenModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm Tuyến Xe Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTuyenForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đi (Tỉnh)</label>
                                <select class="form-select" id="diemDi" required>
                                    <option value="">-- Chọn --</option>
                                    </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Điểm Đến (Tỉnh)</label>
                                <select class="form-select" id="diemDen" required>
                                    <option value="">-- Chọn --</option>
                                    </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thời gian (Giờ)</label>
                                <input type="number" class="form-control" id="thoiGian" required placeholder="VD: 5">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quãng đường (Km)</label>
                                <input type="number" class="form-control" id="quangDuong" required placeholder="VD: 300">
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary">Lưu Tuyến</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        // Check quyền
        if (!isLoggedIn() || (user.vaiTro !== 'AdminBenXe' && user.vaiTro !== 'AdminHeThong')) {
             window.location.href = '/login.html';
        }
        document.getElementById('user-name').innerText = user.hoTen;

        // 1. Load danh sách Tỉnh vào 2 cái Dropdown (Điểm Đi & Điểm Đến)
        async function loadTinhDropdown() {
            try {
                const res = await fetch(`${API_URL}/tinh-thanh`);
                const data = await res.json();
                
                const selectDi = document.getElementById('diemDi');
                const selectDen = document.getElementById('diemDen');

                data.forEach(tinh => {
                    const option = `<option value="${tinh._id}">${tinh.tenTinh}</option>`;
                    selectDi.innerHTML += option;
                    selectDen.innerHTML += option;
                });
            } catch (error) { console.error(error); }
        }

        // 2. Load danh sách Tuyến Xe
        async function loadTuyen() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/tuyen-xe`, {
                     headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const tbody = document.getElementById('table-tuyen');
                tbody.innerHTML = '';
                
                data.forEach(tuyen => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold text-primary">
                                ${tuyen.diemDi.tenTinh} <i class="fa-solid fa-arrow-right mx-2 text-muted"></i> ${tuyen.diemDen.tenTinh}
                            </td>
                            <td>${tuyen.thoiGianDiChuyen} giờ</td>
                            <td>${tuyen.quangDuong} km</td>
                            <td>
                                <button class="btn btn-sm btn-inverse-danger" onclick="alert('Chức năng xóa đang phát triển')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        // 3. Xử lý Thêm Tuyến
        document.getElementById('addTuyenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const diemDi = document.getElementById('diemDi').value;
            const diemDen = document.getElementById('diemDen').value;
            
            if (diemDi === diemDen) {
                alert('Điểm đi và Điểm đến không được trùng nhau!');
                return;
            }

            const token = localStorage.getItem('token');
            const data = {
                diemDi: diemDi,
                diemDen: diemDen,
                thoiGianDiChuyen: document.getElementById('thoiGian').value,
                quangDuong: document.getElementById('quangDuong').value
            };

            try {
                const res = await fetch(`${API_URL}/tuyen-xe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Thêm tuyến thành công!');
                    document.getElementById('addTuyenForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addTuyenModal')).hide();
                    loadTuyen();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        loadTinhDropdown();
        loadTuyen();
    </script>
</body>
</html>
