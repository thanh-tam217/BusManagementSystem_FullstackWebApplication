    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <script src="../assets/js/main.js"></script>
    <script>
        // --- LOGIC JS GIỮ NGUYÊN NHƯ CŨ, CHỈ THÊM PHẦN VẼ BIỂU ĐỒ ---
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') {
            window.location.href = '/login.html';
        }
        document.getElementById('user-name').innerText = user.hoTen;

        async function loadData() {
            try {
                // 1. Lấy thống kê Bến
                const resBen = await fetch(`${API_URL}/ben-xe`);
                const dataBen = await resBen.json();
                document.getElementById('count-ben').innerText = dataBen.length;

                // 2. Đổ dữ liệu vào bảng (Demo 5 dòng đầu)
                const tableBody = document.getElementById('table-ben-xe');
                tableBody.innerHTML = '';
                dataBen.slice(0, 5).forEach((ben, index) => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${ben.tenBen}</td>
                            <td>${ben.maTinh ? ben.maTinh.tenTinh : 'N/A'}</td>
                            <td><label class="badge badge-gradient-success text-success bg-opacity-10">Hoạt động</label></td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error(error);
            }
        }
        
        loadData();

        // 3. Vẽ biểu đồ tròn (Demo Chart.js)
        const ctx = document.getElementById('traffic-chart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Khách hàng', 'Nhân viên', 'Tài xế'],
                datasets: [{
                    data: [30, 10, 5],
                    backgroundColor: ['#b66dff', '#1bcfb4', '#fed713']
                }]
            },
            options: { cutout: '70%' }
        });
    </script>
