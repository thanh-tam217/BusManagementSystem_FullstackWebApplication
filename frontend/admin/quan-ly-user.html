<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - Purple Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-bus-simple me-2"></i> VEXE APP
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard-system.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="menu-title">Tổng quan</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-tinh.html">
                    <i class="fa-solid fa-city"></i>
                    <span class="menu-title">Quản lý Tỉnh</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="quan-ly-ben.html">
                    <i class="fa-solid fa-landmark"></i>
                    <span class="menu-title">Quản lý Bến xe</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="quan-ly-user.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-title">Người dùng</span>
                </a>
            </li>
             <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="user-name">Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=9a55ff&color=fff" class="rounded-circle" width="35">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-success text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-users"></i>
                    </span> Quản lý Tài Khoản
                </h3>
                <button class="btn btn-gradient-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    <i class="fa-solid fa-user-plus me-1"></i> Tạo tài khoản mới
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Họ Tên</th>
                                    <th>Email</th>
                                    <th>Vai trò</th>
                                    <th>Bến Quản Lý</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="table-users">
                                <tr><td colspan="5">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tạo Tài Khoản Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label class="form-label">Họ tên</label>
                            <input type="text" class="form-control" id="hoTen" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email (Đăng nhập)</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" class="form-control" id="soDienThoai" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="matKhau" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Vai trò</label>
                            <select class="form-select" id="vaiTro" onchange="toggleBenSelect()" required>
                                <option value="KhachHang">Khách Hàng</option>
                                <option value="AdminBenXe">Quản lý Bến Xe (AdminBenXe)</option>
                                <option value="AdminHeThong">Admin Hệ Thống</option>
                            </select>
                        </div>

                        <div class="mb-3" id="group-chon-ben" style="display: none;">
                            <label class="form-label text-primary fw-bold">Chọn bến xe quản lý:</label>
                            <select class="form-select" id="maBenQuanLy">
                                <option value="">-- Chọn bến --</option>
                                </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary">Tạo tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;

        // 1. Load danh sách User
        async function loadUsers() {
            const token = localStorage.getItem('token');
            const res = await fetch(`${API_URL}/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const tbody = document.getElementById('table-users');
            tbody.innerHTML = '';
            
            data.forEach(u => {
                // Tô màu badge cho đẹp
                let badgeClass = 'bg-secondary';
                if(u.vaiTro === 'AdminHeThong') badgeClass = 'bg-danger';
                if(u.vaiTro === 'AdminBenXe') badgeClass = 'bg-warning text-dark';
                if(u.vaiTro === 'KhachHang') badgeClass = 'bg-info text-dark';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${u.hoTen}</td>
                        <td>${u.email}</td>
                        <td><span class="badge ${badgeClass}">${u.vaiTro}</span></td>
                        <td>${u.maBenQuanLy ? u.maBenQuanLy.tenBen : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-inverse-danger" onclick="deleteUser('${u._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2. Load danh sách Bến vào Dropdown (để gán cho Admin Bến)
        async function loadBenDropdown() {
            const res = await fetch(`${API_URL}/ben-xe`);
            const data = await res.json();
            const select = document.getElementById('maBenQuanLy');
            data.forEach(ben => {
                select.innerHTML += `<option value="${ben._id}">${ben.tenBen}</option>`;
            });
        }

        // 3. Logic Ẩn/Hiện ô chọn bến
        function toggleBenSelect() {
            const role = document.getElementById('vaiTro').value;
            const group = document.getElementById('group-chon-ben');
            if (role === 'AdminBenXe') {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
            }
        }

        // 4. Xử lý tạo User
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            
            const data = {
                hoTen: document.getElementById('hoTen').value,
                email: document.getElementById('email').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                matKhau: document.getElementById('matKhau').value,
                vaiTro: document.getElementById('vaiTro').value,
                maBenQuanLy: document.getElementById('maBenQuanLy').value
            };

            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Tạo tài khoản thành công!');
                    document.getElementById('addUserForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                    loadUsers();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });
        
        // 5. Hàm xóa user
        async function deleteUser(id) {
            if(!confirm('Bạn có chắc chắn muốn xóa user này?')) return;
            const token = localStorage.getItem('token');
            await fetch(`${API_URL}/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadUsers();
        }

        loadUsers();
        loadBenDropdown();
    </script>
</body>
</html>
