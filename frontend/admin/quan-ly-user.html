        <div class="content-wrapper p-4">
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">

                    <i class="fa-solid fa-users"></i> Quản lý Người dùng

            <div class="card shadow-sm border-0">

                    <div class="row g-2 mb-4 align-items-end">

                            <select class="form-select bg-light border-0" id="filterRole">

                        <div class="col-md-4">

                    <div class="table-responsive">

    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Tạo Tài Khoản Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        
                        <div class="mb-3">
                            <label class="form-label">Họ tên</label>
                            <input type="text" class="form-control" id="hoTen" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email (Đăng nhập)</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" class="form-control" id="soDienThoai" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" id="lblMatKhau">Mật khẩu</label>
                            <input type="password" class="form-control" id="matKhau" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Vai trò</label>
                            <select class="form-select" id="vaiTro" onchange="toggleBenSelect()" required>
                                <option value="KhachHang">Khách Hàng</option>
                                <option value="AdminBenXe">Quản lý Bến Xe (AdminBenXe)</option>
                                <option value="NhanVienBanVe">Nhân viên bán vé</option>
                                <option value="TaiXe">Tài xế</option>
                                <option value="AdminHeThong">Admin Hệ Thống</option>
                            </select>
                        </div>

                        <div class="mb-3" id="group-chon-ben" style="display: none;">
                            <label class="form-label text-primary fw-bold">Chọn bến xe quản lý:</label>
                            <select class="form-select" id="maBenQuanLy">
                                <option value="">-- Chọn bến --</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-primary" id="btnSave">Lưu lại</button>
                        </div>

                </div>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn() || user.vaiTro !== 'AdminHeThong') window.location.href = '/login.html';
        document.getElementById('user-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;

        let allUsers = [];

        // 1. Load danh sách User
        async function loadUsers() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allUsers = await res.json();
                renderTable(allUsers);
            } catch (error) { console.error(error); }
        }

        // 2. Render Table
        function renderTable(data) {
            const tbody = document.getElementById('table-users');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Không tìm thấy user nào</td></tr>';
                return;
            }

            data.forEach(u => {
                // 1. Xác định màu sắc dựa trên vai trò
                let colorClass = 'badge-gradient-blue'; // Màu mặc định (cho Khách hoặc khác)
                
                if(u.vaiTro === 'AdminHeThong')  colorClass = 'badge-gradient-red';
                if(u.vaiTro === 'AdminBenXe')    colorClass = 'badge-gradient-cam';
                if(u.vaiTro === 'NhanVienBanVe') colorClass = 'badge-gradient-green';
                if(u.vaiTro === 'TaiXe')         colorClass = 'badge-gradient-yellow';
                if(u.vaiTro === 'KhachHang')     colorClass = 'badge-gradient-blue';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${u.hoTen}</td>
                        <td>
                            <div>${u.email}</div>
                            <small class="text-muted">${u.soDienThoai}</small>
                        </td>
                        <td>
                            <span class="badge badge-gradient-base ${colorClass}">${u.vaiTro}</span>
                        </td>
                        <td>${u.maBenQuanLy ? u.maBenQuanLy.tenBen : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-inverse-info btn-icon me-1" onclick="openEditModal('${u._id}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-inverse-danger btn-icon" onclick="deleteUser('${u._id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Load danh sách Bến vào Dropdown (Filter & Modal)
        async function loadBenDropdown() {
            try {
                const res = await fetch(`${API_URL}/ben-xe`);
                const data = await res.json();
                const selectModal = document.getElementById('maBenQuanLy');
                const selectFilter = document.getElementById('filterBen');
                
                data.forEach(ben => {
                    const opt = `<option value="${ben._id}">${ben.tenBen}</option>`;
                    selectModal.innerHTML += opt;
                    selectFilter.innerHTML += opt;
                });
            } catch (error) { console.error(error); }
        }

        // 4. Logic Ẩn/Hiện ô chọn bến
        window.toggleBenSelect = function() {
            const role = document.getElementById('vaiTro').value;
            const group = document.getElementById('group-chon-ben');
            // Các vai trò cần chọn bến: AdminBenXe, NhanVienBanVe, TaiXe
            if (['AdminBenXe', 'NhanVienBanVe', 'TaiXe'].includes(role)) {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
            }
        }

        // 5. Logic Tìm kiếm & Lọc
        // function filterUser() {
        //     const role = document.getElementById('filterRole').value;
        //     const benId = document.getElementById('filterBen').value;
        //     const keyword = document.getElementById('searchKeyword').value.toLowerCase();

        //     const filtered = allUsers.filter(u => {
        //         // Lọc theo Vai trò
        //         const matchRole = role === "" || u.vaiTro === role;
                
        //         // Lọc theo Bến (cần lấy id từ object maBenQuanLy)
        //         const idBenDB = u.maBenQuanLy ? u.maBenQuanLy._id : "";
        //         const matchBen = benId === "" || idBenDB === benId;

        //         // Lọc theo Từ khóa
        //         const textData = (u.hoTen + u.email + u.soDienThoai).toLowerCase();
        //         const matchKeyword = textData.includes(keyword);

        //         return matchRole && matchBen && matchKeyword;
        //     });
        //     renderTable(filtered);
        // }

        // Hàm tìm kiếm và lọc tổng hợp
        function filterUser() {
            // 1. Lấy giá trị từ các ô input/select
            const role = document.getElementById('filterRole').value;
            const benId = document.getElementById('filterBen').value;
            
            // Lấy từ khóa, xóa khoảng trắng đầu đuôi và chuyển về chữ thường
            const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();

            // 2. Lọc dữ liệu từ mảng allUsers (biến toàn cục chứa danh sách user)
            const filtered = allUsers.filter(u => {
                // --- Logic lọc Vai trò ---
                const matchRole = role === "" || u.vaiTro === role;
                
                // --- Logic lọc Bến ---
                const idBenDB = u.maBenQuanLy ? u.maBenQuanLy._id : "";
                const matchBen = benId === "" || idBenDB === benId;

                // --- Logic Tìm kiếm chung (Tên, Email, SĐT) ---
                // Kiểm tra an toàn: Nếu dữ liệu null thì gán chuỗi rỗng để không bị lỗi code
                const name = u.hoTen ? u.hoTen.toLowerCase() : "";
                const email = u.email ? u.email.toLowerCase() : "";
                const phone = u.soDienThoai ? u.soDienThoai : "";

                // Kiểm tra từ khóa có xuất hiện trong Tên HOẶC Email HOẶC SĐT không
                const matchKeyword = name.includes(keyword) || 
                                    email.includes(keyword) || 
                                    phone.includes(keyword);

                // Trả về true nếu thỏa mãn TẤT CẢ các điều kiện
                return matchRole && matchBen && matchKeyword;
            });

            // 3. Render lại bảng
            renderTable(filtered);
        }

        function resetFilter() {
            // Xóa trắng các ô nhập liệu
            document.getElementById('filterRole').value = "";      // Reset dropdown chức vụ
            document.getElementById('searchKeyword').value = "";   // Reset ô tìm kiếm
            
            // Render lại toàn bộ danh sách ban đầu (biến allStaff đã lưu sẵn)
            renderTable(allUsers);
        }

        // 6. Modal Add
        window.openAddModal = function() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('modalTitle').innerText = 'Tạo Tài Khoản Mới';
            document.getElementById('btnSave').innerText = 'Tạo tài khoản';
            
            // Reset trạng thái input
            document.getElementById('email').disabled = false;
            document.getElementById('matKhau').required = true;
            document.getElementById('lblMatKhau').innerText = "Mật khẩu";
            document.getElementById('matKhau').placeholder = "";
            document.getElementById('group-chon-ben').style.display = 'none';
            
            new bootstrap.Modal(document.getElementById('userModal')).show();
        }

        // 7. Modal Edit
        window.openEditModal = function(id) {
            const u = allUsers.find(user => user._id === id);
            if(!u) return;

            document.getElementById('userId').value = u._id;
            document.getElementById('hoTen').value = u.hoTen;
            document.getElementById('email').value = u.email;
            document.getElementById('email').disabled = true; // Cấm sửa email
            document.getElementById('soDienThoai').value = u.soDienThoai;
            document.getElementById('vaiTro').value = u.vaiTro;
            
            // Xử lý Bến
            toggleBenSelect(); // Kích hoạt hiển thị dropdown bến nếu cần
            if(u.maBenQuanLy) {
                document.getElementById('maBenQuanLy').value = u.maBenQuanLy._id;
            }

            // Xử lý mật khẩu (không bắt buộc khi sửa)
            document.getElementById('matKhau').value = '';
            document.getElementById('matKhau').required = false;
            document.getElementById('lblMatKhau').innerText = "Mật khẩu mới";
            document.getElementById('matKhau').placeholder = "Để trống nếu không đổi";

            document.getElementById('modalTitle').innerText = 'Cập Nhật Tài Khoản';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            new bootstrap.Modal(document.getElementById('userModal')).show();
        }

        // 8. Submit
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const token = localStorage.getItem('token');
            
            const data = {
                hoTen: document.getElementById('hoTen').value,
                email: document.getElementById('email').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                vaiTro: document.getElementById('vaiTro').value,
                maBenQuanLy: document.getElementById('maBenQuanLy').value
            };

            // Nếu có nhập mật khẩu thì mới gửi
            const matKhau = document.getElementById('matKhau').value;
            if (matKhau) data.matKhau = matKhau;
            else if (!id) { // Nếu tạo mới mà ko nhập pass (dù html có required nhưng check thêm cho chắc)
                alert("Vui lòng nhập mật khẩu"); return;
            }

            let url = `${API_URL}/users`;
            let method = 'POST';
            if (id) {
                url = `${API_URL}/users/${id}`;
                method = 'PUT';
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(id ? 'Cập nhật thành công!' : 'Tạo mới thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                    loadUsers();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });
        
        // 9. Delete
        async function deleteUser(id) {
            if(!confirm('Bạn có chắc chắn muốn xóa user này?')) return;
            const token = localStorage.getItem('token');
            await fetch(`${API_URL}/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadUsers();
        }
        document.getElementById('searchKeyword').addEventListener('keyup', function(e) {
            // Nếu người dùng ấn Enter (key code 13)
            if (e.key === 'Enter') {
                filterUser();
            }
            // Hoặc nếu muốn tìm ngay khi gõ (Real-time search) thì bỏ dòng if đi, gọi thẳng filterUser()
        });
                loadUsers();
        loadBenDropdown();
    </script>
