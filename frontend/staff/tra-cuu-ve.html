<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra Cứu Vé - Purple Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-ticket me-2" style="color: #9a55ff;"></i> TICKET
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-desktop"></i>
                    <span class="menu-title">Bàn làm việc</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="dat-ve.html">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span class="menu-title">Đặt vé tại quầy</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="tra-cuu-ve.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span class="menu-title">Tra cứu vé</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none me-3"></i>
            </div>
            <div class="d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <p class="mb-0 fw-bold text-dark" id="staff-name">Staff</p>
                    <small class="text-muted">Nhân viên bán vé</small>
                </div>
                <img src="https://ui-avatars.com/api/?name=Staff&background=1bcfb4&color=fff" class="rounded-circle shadow-sm" width="40">
            </div>
        </nav>

        <div class="content-wrapper p-4">
            
            <div class="page-header mb-4 d-flex justify-content-between align-items-center">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-info text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-ticket"></i>
                    </span> Danh Sách Vé Đã Bán
                </h3>
                <button class="btn btn-light btn-sm shadow-sm" onclick="loadAllTickets()">
                    <i class="fa-solid fa-rotate-right me-1"></i> Làm mới
                </button>
            </div>

            <div class="row">
                <div class="col-12 grid-margin stretch-card">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <div class="input-group mb-4">
                                <input type="text" class="form-control form-control-lg bg-light border-0" id="searchInput" placeholder="Tìm theo SĐT khách hoặc Mã vé...">
                                <button class="btn btn-gradient-info text-white fw-bold px-4" type="button" onclick="loadAllTickets()">
                                    <i class="fa-solid fa-magnifying-glass me-2"></i> TÌM KIẾM
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="bg-light">
                                        <tr>
                                            <th>Mã Vé</th>
                                            <th>Khách Hàng</th>
                                            <th>Hành Trình</th>
                                            <th>Ghế</th>
                                            <th>Giá Vé</th>
                                            <th>Ngày Bán</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-result">
                                        </tbody>
                                </table>
                            </div>
                            
                            <div class="text-center mt-3 text-muted small" id="record-count"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn()) window.location.href = '/login.html';
        document.getElementById('staff-name').innerText = user.hoTen;

        // Hàm tải vé (Dùng chung cho cả Tìm kiếm và Load tất cả)
        async function loadAllTickets() {
            const keyword = document.getElementById('searchInput').value.trim();
            const tbody = document.getElementById('table-result');
            
            // Hiển thị loading
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Đang tải dữ liệu...</p></td></tr>';

            try {
                const token = localStorage.getItem('token');
                // Nếu có keyword thì thêm param, không thì gọi API gốc để lấy hết
                let url = `${API_URL}/ve-xe/tra-cuu`;
                if(keyword) {
                    url += `?keyword=${keyword}`;
                }

                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                tbody.innerHTML = '';
                document.getElementById('record-count').innerText = `Hiển thị ${data.length} bản ghi mới nhất`;

                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5"><i class="fa-regular fa-folder-open fs-2 mb-3 opacity-25"></i><br>Không tìm thấy vé nào.</td></tr>';
                    return;
                }

                data.forEach(ve => {
                    const gia = new Intl.NumberFormat('vi-VN').format(ve.tongTien);
                    
                    // Xử lý hiển thị Bến (fallback nếu chưa populate đủ)
                    const benDi = ve.maChuyen.benKhoiHanh ? ve.maChuyen.benKhoiHanh.tenBen : 'Bến đi';
                    const benDen = ve.maChuyen.benDen ? ve.maChuyen.benDen.tenBen : 'Bến đến';
                    
                    const timeStart = new Date(ve.maChuyen.thoiGianKhoiHanh).toLocaleString('vi-VN', {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
                    const ngayDat = new Date(ve.ngayDat).toLocaleString('vi-VN');

                    tbody.innerHTML += `
                        <tr>
                            <td>
                                <span class="badge bg-light text-dark border">#${ve._id.slice(-6).toUpperCase()}</span>
                            </td>
                            <td>
                                <div class="fw-bold text-dark">${ve.tenKhach || 'Khách lẻ'}</div>
                                <small class="text-muted"><i class="fa-solid fa-phone me-1" style="font-size: 0.8em"></i>${ve.sdtKhach || '---'}</small>
                            </td>
                            <td>
                                <div class="fw-bold text-primary" style="font-size: 0.95em;">${benDi} <i class="fa-solid fa-arrow-right mx-1 text-muted small"></i> ${benDen}</div>
                                <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>${timeStart}</small>
                            </td>
                            <td>
                                <span class="badge badge-gradient-info fs-6">${ve.maGhe}</span>
                            </td>
                            <td class="fw-bold text-danger">${gia} đ</td>
                            <td class="small text-muted">${ngayDat}</td>
                        </tr>
                    `;
                });

            } catch (error) { 
                console.error(error); 
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Lỗi kết nối server!</td></tr>';
            }
        }

        // Tự động chạy khi vào trang
        loadAllTickets();

        // Thêm sự kiện bấm Enter để tìm
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadAllTickets();
            }
        });
    </script>
</body>
</html>
