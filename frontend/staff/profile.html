    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

        <div class="brand-logo">
            <i class="fa-solid fa-ticket me-2" style="color: #9a55ff;"></i> THT BUSLINE
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-desktop"></i>
                    <span class="menu-title">Bàn làm việc</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="dat-ve.html">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span class="menu-title">Đặt vé tại quầy</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="tra-cuu-ve.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span class="menu-title">Tra cứu vé</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="profile.html">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="menu-title">Thông tin cá nhân</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="menu-title">Đăng xuất</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-panel">
        <nav class="navbar navbar-expand-lg sticky-top d-flex justify-content-between">
            <i class="fa-solid fa-bars text-secondary fs-4 d-lg-none"></i>
            <div class="ms-auto d-flex align-items-center">
                <span class="fw-bold me-2" id="header-name">Staff</span>
                <img src="https://ui-avatars.com/api/?name=User&background=random&size=128" class="rounded-circle img-fluid border border-3 border-light shadow" id="profile-avatar-header" style="width: 40px;">
                <!-- <img src="https://ui-avatars.com/api/?name=Staff&background=1bcfb4&color=fff" class="rounded-circle" width="40"> -->
            </div>
        </nav>

        <div class="content-wrapper p-4">
            <div class="page-header mb-4">
                <h3 class="page-title fw-bold">
                    <span class="page-title-icon bg-gradient-primary text-white me-2 p-2 rounded">
                        <i class="fa-solid fa-user"></i>
                    </span> Hồ Sơ Cá Nhân
                </h3>
            </div>

            <div class="row">
                <div class="col-md-4 grid-margin stretch-card">
                    <div class="card shadow-sm border-0 text-center">
                        <div class="card-body">
                            <div class="mb-4 position-relative d-inline-block">
                                <img src="https://ui-avatars.com/api/?name=User&background=random&size=128" class="rounded-circle img-fluid border border-3 border-light shadow" id="profile-avatar" style="width: 120px;">
                                <span class="position-absolute bottom-0 end-0 bg-success border border-light rounded-circle p-2"></span>
                            </div>
                            <h4 class="fw-bold mb-1" id="display-name">Đang tải...</h4>
                            <p class="text-muted mb-3" id="display-role">...</p>
                            <p class="small text-muted mb-4"><i class="fa-solid fa-location-dot me-1"></i> <span id="display-address">Việt Nam</span></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-8 grid-margin stretch-card">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="card-title mb-0">Thông tin chi tiết</h4>
                                <button class="btn btn-outline-primary btn-sm fw-bold" id="btn-edit" onclick="enableEditMode()">
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Chỉnh sửa
                                </button>
                            </div>

                            <form id="profileForm">
                                <div class="form-group mb-3">
                                    <label class="form-label fw-bold text-muted small">HỌ VÀ TÊN</label>
                                    <input type="text" class="form-control fw-bold text-dark" id="hoTen" disabled>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">EMAIL</label>
                                        <input type="email" class="form-control bg-light" id="email" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">SỐ ĐIỆN THOẠI</label>
                                        <input type="text" class="form-control fw-bold text-dark" id="soDienThoai" disabled>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">NGÀY SINH</label>
                                        <input type="date" class="form-control" id="ngaySinh" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">GIỚI TÍNH</label>
                                        <select class="form-select" id="gioiTinh" disabled>
                                            <option value="Nam">Nam</option>
                                            <option value="Nu">Nữ</option>
                                            <option value="Khac">Khác</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group mb-4">
                                    <label class="form-label fw-bold text-muted small">ĐỊA CHỈ</label>
                                    <input type="text" class="form-control" id="diaChi" placeholder="Chưa cập nhật" disabled>
                                </div>

                                <div id="password-section" class="d-none p-3 bg-light rounded mb-3">
                                    <h6 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-lock me-2"></i>Đổi mật khẩu</h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-2">
                                            <input type="password" class="form-control form-control-sm" id="matKhauMoi" placeholder="Mật khẩu mới">
                                        </div>
                                        <div class="col-md-6 mb-2">
                                            <input type="password" class="form-control form-control-sm" id="xacNhanMatKhau" placeholder="Xác nhận mật khẩu">
                                        </div>
                                    </div>
                                </div>

                                <div id="action-buttons" class="d-none text-end">
                                    <button type="button" class="btn btn-light me-2" onclick="cancelEditMode()">Hủy bỏ</button>
                                    <button type="submit" class="btn btn-gradient-success fw-bold px-4">
                                        <i class="fa-solid fa-check me-1"></i> Lưu Thay Đổi
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn()) window.location.href = '/login.html';
        document.getElementById('header-name').innerText = user.hoTen;
        document.getElementById('profile-avatar-header').src = `https://ui-avatars.com/api/?name=${user.hoTen}&background=random&size=128`;

        let originalData = {}; // Biến lưu dữ liệu gốc để khôi phục khi bấm Hủy

        // 1. Load Profile
        // 1. Load Profile (Dùng API chuẩn GET /api/users/profile)
        async function loadProfile() {
            try {
                const token = localStorage.getItem('token');
                
                // Gọi API lấy thông tin chính mình
                const res = await fetch(`${API_URL}/users/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const myProfile = await res.json();
                    
                    // Lưu lại data gốc
                    originalData = myProfile;

                    // Render dữ liệu ra UI
                    renderDataToForm(myProfile);
                } else {
                    // Nếu lỗi (ví dụ token hết hạn), đẩy về login
                    console.error("Lỗi tải profile:", res.status);
                    if(res.status === 401) window.location.href = '/login.html';
                }
            } catch (error) { console.error(error); }
        }
        // Hàm phụ: Điền dữ liệu vào form
        function renderDataToForm(data) {
            document.getElementById('hoTen').value = data.hoTen;
            document.getElementById('email').value = data.email;
            document.getElementById('soDienThoai').value = data.soDienThoai;
            document.getElementById('diaChi').value = data.diaChi || '';
            document.getElementById('gioiTinh').value = data.gioiTinh || 'Nam';
            
            if(data.ngaySinh) {
                const date = new Date(data.ngaySinh);
                document.getElementById('ngaySinh').value = date.toISOString().split('T')[0];
            }

            // Render Card bên trái
            document.getElementById('display-name').innerText = data.hoTen;
            
            let roleText = 'Khách hàng';
            if(data.vaiTro === 'AdminHeThong') roleText = 'Quản trị viên';
            if(data.vaiTro === 'AdminBenXe') roleText = 'Quản lý bến';
            if(data.vaiTro === 'NhanVienBanVe') roleText = 'Nhân viên bán vé';
            document.getElementById('display-role').innerText = roleText;
            
            document.getElementById('display-address').innerText = data.diaChi || 'Chưa cập nhật địa chỉ';
            document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${data.hoTen}&background=random&size=128`;
        }

        // 2. Chế độ Chỉnh sửa (Enable Edit Mode)
        window.enableEditMode = function() {
            // Hiển thị nút Lưu/Hủy, ẩn nút Sửa
            document.getElementById('btn-edit').classList.add('d-none');
            document.getElementById('action-buttons').classList.remove('d-none');
            document.getElementById('password-section').classList.remove('d-none');

            // Bỏ disabled cho các input (trừ email)
            const inputs = document.querySelectorAll('#profileForm input:not(#email), #profileForm select');
            inputs.forEach(input => {
                input.disabled = false;
                input.classList.remove('text-dark', 'fw-bold'); // Bỏ style đậm để nhìn giống input thường
                input.classList.add('bg-white');
            });

            document.getElementById('hoTen').focus();
        }

        // 3. Hủy Chỉnh sửa (Cancel Edit Mode)
        window.cancelEditMode = function() {
            // Khôi phục giao diện
            document.getElementById('btn-edit').classList.remove('d-none');
            document.getElementById('action-buttons').classList.add('d-none');
            document.getElementById('password-section').classList.add('d-none');

            // Disabled lại các input
            const inputs = document.querySelectorAll('#profileForm input, #profileForm select');
            inputs.forEach(input => {
                input.disabled = true;
                input.classList.add('text-dark', 'fw-bold');
                input.classList.remove('bg-white');
            });

            // Reset dữ liệu về ban đầu (Undo)
            renderDataToForm(originalData);
            document.getElementById('matKhauMoi').value = '';
            document.getElementById('xacNhanMatKhau').value = '';
        }

        // 4. Submit Form
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const matKhauMoi = document.getElementById('matKhauMoi').value;
            const xacNhan = document.getElementById('xacNhanMatKhau').value;

            if (matKhauMoi && matKhauMoi !== xacNhan) {
                alert("Mật khẩu xác nhận không khớp!");
                return;
            }

            const data = {
                hoTen: document.getElementById('hoTen').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                diaChi: document.getElementById('diaChi').value,
                gioiTinh: document.getElementById('gioiTinh').value,
                ngaySinh: document.getElementById('ngaySinh').value
            };

            if (matKhauMoi) data.matKhauMoi = matKhauMoi;

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    const updatedUser = await res.json();
                    
                    // 1. Cập nhật localStorage (QUAN TRỌNG: Để sau khi reload, tên trên Sidebar hiển thị đúng)
                    const localUser = JSON.parse(localStorage.getItem('user'));
                    localUser.hoTen = updatedUser.hoTen;
                    localStorage.setItem('user', JSON.stringify(localUser));

                    alert('Cập nhật thành công!');
                    
                    // 2. Tự động reload trang
                    window.location.reload(); 
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (error) { console.error(error); }
        });

        loadProfile();
    </script>
</body>
</html>
