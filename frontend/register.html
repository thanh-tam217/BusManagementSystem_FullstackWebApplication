<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - VEXE RERE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #f2edf3;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #9a55ff;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="d-flex justify-content-center">
            <div class="auth-card">
                <div class="brand-logo">
                    <i class="fa-solid fa-bus-simple"></i> VEXE RERE
                </div>
                <h5 class="text-center text-muted mb-4 fw-normal">Đăng ký tài khoản khách hàng</h5>

                <div id="alert-msg" class="alert alert-danger" style="display: none;"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" id="hoTen" placeholder="Họ và tên" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" id="soDienThoai" placeholder="Số điện thoại" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg" id="matKhau" placeholder="Mật khẩu" required>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-gradient-primary btn-lg fw-bold text-white" style="background: linear-gradient(to right, #da8cff, #9a55ff);">
                            ĐĂNG KÝ NGAY
                        </button>
                    </div>

                    <div class="text-center mt-4 fw-light">
                        Bạn đã có tài khoản? <a href="login.html" class="text-primary fw-bold text-decoration-none">Đăng nhập</a>
                    </div>
                    <div class="text-center mt-2">
                        <a href="index.html" class="text-secondary small text-decoration-none"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
