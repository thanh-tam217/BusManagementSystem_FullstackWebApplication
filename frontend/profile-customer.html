<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Của Tôi - FUTA Bus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fa;">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fa-solid fa-bus me-2"></i>THT BUSLINE
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="ve-cua-toi.html">Vé của tôi</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="profile-customer.html">Tài khoản</a></li>
                    
                    <li class="nav-item ms-3" id="nav-auth"></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            
            <div class="col-lg-3 mb-4">
                <div class="card shadow border-0 text-center">
                    <div class="card-body">
                        <div class="mb-3"><img src="" class="rounded-circle border border-3" id="profile-avatar" style="width: 100px;"></div>
                        <h5 class="fw-bold" id="display-name">...</h5>
                        <p class="text-muted small">Khách hàng thân thiết</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fw-bold mb-0">Hồ sơ cá nhân</h4>
                            <button class="btn btn-primary btn-sm rounded-pill px-3" id="btn-edit" onclick="enableEditMode()"><i class="fa-solid fa-pen"></i> Sửa</button>
                        </div>
                        
                        <form id="profileForm">
                            <div class="form-group mb-3">
                                    <label class="form-label fw-bold text-muted small">HỌ VÀ TÊN</label>
                                    <input type="text" class="form-control fw-bold text-dark" id="hoTen" disabled>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">EMAIL</label>
                                        <input type="email" class="form-control bg-light" id="email" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">SỐ ĐIỆN THOẠI</label>
                                        <input type="text" class="form-control fw-bold text-dark" id="soDienThoai" disabled>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">NGÀY SINH</label>
                                        <input type="date" class="form-control" id="ngaySinh" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-muted small">GIỚI TÍNH</label>
                                        <select class="form-select" id="gioiTinh" disabled>
                                            <option value="Nam">Nam</option>
                                            <option value="Nu">Nữ</option>
                                            <option value="Khac">Khác</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group mb-4">
                                    <label class="form-label fw-bold text-muted small">ĐỊA CHỈ</label>
                                    <input type="text" class="form-control" id="diaChi" placeholder="Chưa cập nhật" disabled>
                                </div>

                                <div id="password-section" class="d-none p-3 bg-light rounded mb-3">
                                    <h6 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-lock me-2"></i>Đổi mật khẩu</h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-2"><input type="password" class="form-control form-control-sm" id="matKhauMoi" placeholder="Mật khẩu mới"></div>
                                        <div class="col-md-6 mb-2"><input type="password" class="form-control form-control-sm" id="xacNhanMatKhau" placeholder="Xác nhận mật khẩu"></div>
                                    </div>
                                </div>

                                <div id="action-buttons" class="d-none text-end">
                                    <button type="button" class="btn btn-light me-2" onclick="cancelEditMode()">Hủy bỏ</button>
                                    <button type="submit" class="btn btn-success fw-bold px-4"><i class="fa-solid fa-check me-1"></i> Lưu Thay Đổi</button>
                                </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Check login khách hàng
        const user = JSON.parse(localStorage.getItem('user'));
        if (!isLoggedIn()) window.location.href = 'login.html';

        // --- PASTE LOGIC RENDER DROPDOWN VÀO ĐÂY (Giống hệt file trên) ---
        let dashboardLink = '';
        if(user.vaiTro === 'AdminHeThong') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard-system.html"><i class="fa-solid fa-gauge-high me-2 text-primary"></i>Quản trị hệ thống</a></li><li><hr class="dropdown-divider"></li>';
        } else if(user.vaiTro === 'AdminBenXe') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard-station.html"><i class="fa-solid fa-building me-2 text-primary"></i>Quản lý bến</a></li><li><hr class="dropdown-divider"></li>';
        } else if(user.vaiTro === 'NhanVienBanVe') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard.html"><i class="fa-solid fa-desktop me-2 text-primary"></i>Bàn làm việc</a></li><li><hr class="dropdown-divider"></li>';
        }

        document.getElementById('nav-auth').innerHTML = `
            <div class="dropdown">
                <button class="btn btn-light rounded-pill px-3 border dropdown-toggle fw-bold text-dark d-flex align-items-center shadow-sm" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://ui-avatars.com/api/?name=${user.hoTen}&background=random" class="rounded-circle me-2" width="32" height="32">
                    <span>${user.hoTen}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" aria-labelledby="userDropdown" style="border-radius: 12px; min-width: 220px;">
                    ${dashboardLink}
                    <li><a class="dropdown-item py-2" href="profile-customer.html"><i class="fa-solid fa-user-gear me-2 text-muted"></i> Thông tin cá nhân</a></li>
                    <li><a class="dropdown-item py-2" href="ve-cua-toi.html"><i class="fa-solid fa-ticket me-2 text-muted"></i> Vé của tôi</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger fw-bold" href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a></li>
                </ul>
            </div>
        `;

        async function loadProfile() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const myProfile = await res.json();
                    originalData = myProfile;
                    renderDataToForm(myProfile);
                } else { if(res.status === 401) window.location.href = 'login.html'; }
            } catch (error) { console.error(error); }
        }

        function renderDataToForm(data) {
            document.getElementById('hoTen').value = data.hoTen;
            document.getElementById('email').value = data.email;
            document.getElementById('soDienThoai').value = data.soDienThoai;
            document.getElementById('diaChi').value = data.diaChi || '';
            document.getElementById('gioiTinh').value = data.gioiTinh || 'Nam';
            if(data.ngaySinh) document.getElementById('ngaySinh').value = new Date(data.ngaySinh).toISOString().split('T')[0];

            document.getElementById('display-name').innerText = data.hoTen;
            document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${data.hoTen}&background=random&size=128`;
        }

        window.enableEditMode = function() {
            document.getElementById('btn-edit').classList.add('d-none');
            document.getElementById('action-buttons').classList.remove('d-none');
            document.getElementById('password-section').classList.remove('d-none');
            document.querySelectorAll('#profileForm input:not(#email), #profileForm select').forEach(input => {
                input.disabled = false; input.classList.remove('text-dark', 'fw-bold'); input.classList.add('bg-white');
            });
        }

        window.cancelEditMode = function() {
            document.getElementById('btn-edit').classList.remove('d-none');
            document.getElementById('action-buttons').classList.add('d-none');
            document.getElementById('password-section').classList.add('d-none');
            document.querySelectorAll('#profileForm input, #profileForm select').forEach(input => {
                input.disabled = true; input.classList.add('text-dark', 'fw-bold'); input.classList.remove('bg-white');
            });
            renderDataToForm(originalData);
            document.getElementById('matKhauMoi').value = ''; document.getElementById('xacNhanMatKhau').value = '';
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matKhauMoi = document.getElementById('matKhauMoi').value;
            const xacNhan = document.getElementById('xacNhanMatKhau').value;
            if (matKhauMoi && matKhauMoi !== xacNhan) { alert("Mật khẩu không khớp!"); return; }

            const data = {
                hoTen: document.getElementById('hoTen').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                diaChi: document.getElementById('diaChi').value,
                gioiTinh: document.getElementById('gioiTinh').value,
                ngaySinh: document.getElementById('ngaySinh').value
            };
            if (matKhauMoi) data.matKhauMoi = matKhauMoi;

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/users/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    const updatedUser = await res.json();
                    const localUser = JSON.parse(localStorage.getItem('user'));
                    localUser.hoTen = updatedUser.hoTen;
                    localStorage.setItem('user', JSON.stringify(localUser));
                    alert('Cập nhật thành công!');
                    window.location.reload(); 
                } else { alert((await res.json()).message); }
            } catch (error) { console.error(error); }
        });

        loadProfile();
    </script>
</body>
</html>
