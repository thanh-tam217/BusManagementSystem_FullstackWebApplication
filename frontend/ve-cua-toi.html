<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vé Của Tôi - THT BUSLINE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fa;">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fa-solid fa-bus me-2"></i>FUTA BUS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="ve-cua-toi.html">Vé của tôi</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile-customer.html">Tài khoản</a></li>
                    
                    <li class="nav-item ms-3" id="nav-auth"></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h3 class="fw-bold mb-4 text-primary">Lịch Sử Đặt Vé</h3>
        
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-secondary">
                            <tr>
                                <th class="p-3">Mã Vé</th>
                                <th>Hành Trình</th>
                                <th>Ghế</th>
                                <th>Tổng Tiền</th>
                                <th>Ngày Đặt</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody id="ds-ve">
                            <tr><td colspan="6" class="text-center p-4">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        const user = localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : null;
        if(!user) window.location.href = 'login.html';

        // --- LOGIC RENDER DROPDOWN (Copy từ index.html) ---
        let dashboardLink = '';
        if(user.vaiTro === 'AdminHeThong') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard-system.html"><i class="fa-solid fa-gauge-high me-2 text-primary"></i>Quản trị hệ thống</a></li><li><hr class="dropdown-divider"></li>';
        } else if(user.vaiTro === 'AdminBenXe') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard-station.html"><i class="fa-solid fa-building me-2 text-primary"></i>Quản lý bến</a></li><li><hr class="dropdown-divider"></li>';
        } else if(user.vaiTro === 'NhanVienBanVe') {
            dashboardLink = '<li><a class="dropdown-item" href="admin/dashboard.html"><i class="fa-solid fa-desktop me-2 text-primary"></i>Bàn làm việc</a></li><li><hr class="dropdown-divider"></li>';
        }

        document.getElementById('nav-auth').innerHTML = `
            <div class="dropdown">
                <button class="btn btn-light rounded-pill px-3 border dropdown-toggle fw-bold text-dark d-flex align-items-center shadow-sm" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://ui-avatars.com/api/?name=${user.hoTen}&background=random" class="rounded-circle me-2" width="32" height="32">
                    <span>${user.hoTen}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" aria-labelledby="userDropdown" style="border-radius: 12px; min-width: 220px;">
                    ${dashboardLink}
                    <li><a class="dropdown-item py-2" href="profile-customer.html"><i class="fa-solid fa-user-gear me-2 text-muted"></i> Thông tin cá nhân</a></li>
                    <li><a class="dropdown-item py-2" href="ve-cua-toi.html"><i class="fa-solid fa-ticket me-2 text-muted"></i> Vé của tôi</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger fw-bold" href="#" onclick="logout()"><i class="fa-solid fa-power-off me-2"></i> Đăng xuất</a></li>
                </ul>
            </div>
        `;

        // 1. Hàm tải danh sách vé
        async function loadVe() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/ve-xe/cua-toi`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const tbody = document.getElementById('ds-ve');
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center p-5 text-muted">Bạn chưa đặt vé nào.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(ve => {
                    const benDi = ve.maChuyen.benKhoiHanh ? ve.maChuyen.benKhoiHanh.tenBen : 'Bến Đi';
                    const benDen = ve.maChuyen.benDen ? ve.maChuyen.benDen.tenBen : 'Bến Đến';
                    const time = new Date(ve.maChuyen.thoiGianKhoiHanh).toLocaleString('vi-VN');
                    const seats = Array.isArray(ve.maGhe) ? ve.maGhe.join(', ') : ve.maGhe;
                    const gia = new Intl.NumberFormat('vi-VN').format(ve.tongTien);

                    // Xử lý hiển thị trạng thái
                    let statusBadge = '';
                    if (ve.trangThaiThanhToan === 'DaThanhToan') {
                        statusBadge = '<span class="badge bg-success">Đã thanh toán</span>';
                    } else if (ve.trangThaiThanhToan === 'Huy') {
                        statusBadge = '<span class="badge bg-danger">Đã hủy</span>';
                    } else {
                        statusBadge = '<span class="badge bg-warning text-dark">Chờ thanh toán</span>';
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td class="p-3"><span class="badge bg-light text-dark border">#${ve._id.slice(-6).toUpperCase()}</span></td>
                            <td>
                                <div class="fw-bold">${benDi} <i class="fa-solid fa-arrow-right small mx-1 text-muted"></i> ${benDen}</div>
                                <small class="text-muted">${time}</small>
                            </td>
                            <td><span class="badge bg-info">${seats}</span></td>
                            <td class="fw-bold text-danger">${gia} đ</td>
                            <td class="text-muted small">${new Date(ve.ngayDat).toLocaleDateString('vi-VN')}</td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;
                });

            } catch (e) { console.error(e); }
        }

        // 2. Logic cập nhật vé mới nhất
        async function updateLatestTicketStatus(status) {
            try {
                const token = localStorage.getItem('token');
                // Lấy danh sách để tìm vé mới nhất
                const res = await fetch(`${API_URL}/ve-xe/cua-toi`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.length > 0) {
                    const latestTicket = data[0]; // Vé mới nhất (do sort backend)
                    
                    // Chỉ cập nhật nếu nó đang chờ thanh toán
                    if (latestTicket.trangThaiThanhToan === 'ChuaThanhToan') {
                        console.log("Đang cập nhật vé:", latestTicket._id);
                        
                        await fetch(`${API_URL}/ve-xe/cap-nhat-thanh-toan`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                maVe: latestTicket._id, 
                                trangThai: status 
                            })
                        });
                        console.log("Cập nhật thành công!");
                    }
                }
            } catch (e) { console.error(e); }
        }

        // 3. Logic xử lý VNPay Return
        async function checkVNPayReturn() {
            const urlParams = new URLSearchParams(window.location.search);
            const vnp_ResponseCode = urlParams.get('vnp_ResponseCode');

            if (vnp_ResponseCode) {
                // Xóa param trên URL để nhìn cho sạch
                window.history.replaceState({}, document.title, window.location.pathname);

                if (vnp_ResponseCode === '00') {
                    // Bước 1: Cập nhật Database trước (Chờ cho xong)
                    await updateLatestTicketStatus('DaThanhToan');
                    
                    // Bước 2: Thông báo
                    alert("✅ Thanh toán VNPay thành công!");
                } else {
                    alert("❌ Thanh toán thất bại hoặc bị hủy.");
                }
            }
            
            // Bước 3: Sau khi xử lý xong xuôi (hoặc không có param) mới tải danh sách hiển thị
            loadVe();
        }

        // --- KHỞI CHẠY ---
        // Chỉ gọi hàm check, không gọi loadVe() riêng lẻ nữa
        checkVNPayReturn();

    </script>
</body>
</html>
